<script>
(function () {

  /* ══ 0. Класс на body для CSS-скопинга ══ */
  document.body.classList.add('nx-palitra');

  /* ══ 0a. Контекстная панель товара ══ */
  (function () {
    var backUrl = '';
    var productCtx = null;
    try { backUrl     = sessionStorage.getItem('nx_palette_back') || ''; } catch (e) {}
    try { productCtx  = JSON.parse(sessionStorage.getItem('nx_palette_product') || 'null'); } catch (e) {}
    if (!backUrl) return;

    var ctx     = document.getElementById('nx-pal-ctx');
    var nameEl  = document.getElementById('nx-ctx-name');
    var coatEl  = document.getElementById('nx-ctx-coating');
    var backBtn = document.getElementById('nx-ctx-back');
    if (!ctx) return;

    if (nameEl && productCtx) nameEl.textContent  = productCtx.name || '';
    if (coatEl && productCtx) coatEl.textContent  = productCtx.coating ? 'Покрытие: ' + productCtx.coating : '';
    if (backBtn) {
      backBtn.href = backUrl;
      backBtn.addEventListener('click', function (e) {
        e.preventDefault();
        try { sessionStorage.removeItem('nx_palette_back'); } catch (ex) {}
        try { sessionStorage.removeItem('nx_palette_product'); } catch (ex) {}
        window.location.href = backUrl;
      });
    }
    ctx.style.display = '';
  })();

  /* ══ 0b. Фильтр по бренду палитры ══ */
  var activeBrand = 'all';

  var BRANDS = [
    { key: 'all',      label: 'Все' },
    { key: 'vinha',    label: 'Vinha' },
    { key: 'valtti',   label: 'Valtti' },
    { key: 'puutalot', label: 'Puutalot' },
    { key: 'ral',      label: 'RAL' },
    { key: 'deco',     label: 'Deco' }
  ];

  /* Единый детектор бренда по тексту (используется и в гриде, и в ограничении 0c) */
  function brandOf(text) {
    text = text || '';
    if (/\bvinha\b/i.test(text))    return 'vinha';
    if (/\bvaltti\b/i.test(text))   return 'valtti';
    if (/\bpuutalot\b/i.test(text)) return 'puutalot';
    if (/\bral\b/i.test(text))      return 'ral';
    if (/\bdeco\b/i.test(text))     return 'deco';
    return null;
  }

  function getCardBrand(card) {
    var d = card.querySelector('.t-store__card__descr,.t-catalog__card__descr');
    var ti = card.querySelector('.t-store__card__title,.t-catalog__card__title');
    return brandOf((d ? d.textContent : '') + ' ' + (ti ? ti.textContent : '')) || 'other';
  }

  function applyBrandFilter() {
    document.querySelectorAll(
      '.t-store__card:not(.t-store__card-preloader),.t-catalog__card:not(.t-catalog__card-preloader)'
    ).forEach(function (card) {
      var b = getCardBrand(card);
      /* Грид НЕ фильтруется по типу покрытия (иначе страница пустеет, когда
         текущая часть каталога — несовместимый бренд). Совместимость показываем
         только серением кнопок брендов + предупреждением (см. mark()/showMsg).
         Грид режется лишь по ЯВНОМУ выбору бренда пользователем. */
      var show = (activeBrand === 'all') ? true : (b === activeBrand);
      card.style.display = show ? '' : 'none';
    });
  }

  function buildBrandFilter() {
    if (document.getElementById('nx-coat-wrap')) return;
    var container = document.querySelector(
      '.t-catalog__filter-w-parts, .t-catalog__filter-container, .t-catalog__cont-filter'
    );
    if (!container) return;

    var wrap = document.createElement('div');
    wrap.id = 'nx-coat-wrap';
    wrap.className = 'nx-coat-wrap';
    var pills = BRANDS.map(function (b) {
      return '<button class="nx-coat-btn' + (b.key === 'all' ? ' nx-active' : '') +
             '" data-brand="' + b.key + '">' + b.label + '</button>';
    }).join('');
    wrap.innerHTML = '<div class="nx-coat-title">Бренд палитры</div><div class="nx-coat-pills">' + pills + '</div>';
    container.appendChild(wrap);

    wrap.querySelectorAll('.nx-coat-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        activeBrand = this.dataset.brand;
        wrap.querySelectorAll('.nx-coat-btn').forEach(function (b) { b.classList.remove('nx-active'); });
        this.classList.add('nx-active');
        applyBrandFilter();
      });
    });
  }

  /* Tilda рендерит каталог с задержкой и при смене категории */
  var _brandRefreshScheduled = false;
  function scheduleBrandRefresh() {
    if (_brandRefreshScheduled) return;
    _brandRefreshScheduled = true;
    setTimeout(function () {
      _brandRefreshScheduled = false;
      buildBrandFilter();
      if (activeBrand !== 'all') applyBrandFilter();
    }, 140);
  }
  new MutationObserver(scheduleBrandRefresh).observe(document.body, { childList: true, subtree: true });

  setTimeout(scheduleBrandRefresh, 600);

  /* ══ 0c. Ограничение палитр по типу покрытия ══
     При переходе с карточки товара показываем подходящие палитры,
     остальные — выключаем; по клику на выключенную выводим сообщение. */
  (function () {
    var pc = null;
    try { pc = JSON.parse(sessionStorage.getItem('nx_palette_product') || 'null'); } catch (e) {}
    var coating = (pc && pc.coating ? String(pc.coating) : '').toLowerCase().trim();

    var OPAQUE = ['ral', 'vinha', 'puutalot', 'deco'];   /* Укрывная */
    var VALTTI = ['valtti'];                             /* пропитки / лессирующие / лаки / воск */
    var COATING_BRANDS = {
      'укрывная':              OPAQUE,
      'пропитка гидромаслом':  VALTTI,
      'лессирующая':           VALTTI,
      'лессирующая premium':   VALTTI,
      'лак снаружи':           VALTTI,
      'лак внутри':            VALTTI,
      'воск внутри':           VALTTI
    };
    var allowed = COATING_BRANDS[coating];
    if (!allowed) allowed = null;
    /* Грид по покрытию НЕ предфильтруем и НЕ авто-применяем нативный фильтр —
       страница всегда показывает все палитры. Совместимость доносим только
       серением несовместимых кнопок брендов + предупреждением по клику. */

    var MSG = 'Для данного типа покрытия не подходит. Уточняйте у менеджера!';
    /* нативные кнопки фильтра палитр Tilda (store parts-switch) */
    var NATIVE_SEL = '[data-storepart-path], .t-catalog__parts-switch-btn';

    /* бренд нативной кнопки — по data-storepart-path ("Палитра RAL"), иначе по тексту
       (детектор brandOf определён во внешней области — см. секцию 0b) */
    function nativeBrand(el) {
      return brandOf((el.getAttribute && el.getAttribute('data-storepart-path')) || el.textContent);
    }
    function uniq(arr) {
      var out = [];
      (arr || []).forEach(function (x) { if (out.indexOf(x) === -1) out.push(x); });
      return out;
    }
    function brandsFromCoatingValue(v) {
      var t = String(v || '').toLowerCase();
      var out = [];
      if (t.indexOf('укрыв') !== -1) out = out.concat(OPAQUE);
      if (t.indexOf('пропит') !== -1 || t.indexOf('лессир') !== -1 || t.indexOf('лак') !== -1 || t.indexOf('воск') !== -1 || t.indexOf('valtti') !== -1) {
        out = out.concat(VALTTI);
      }
      return uniq(out);
    }
    function selectedCoatingBrands() {
      var item = coatingItem();
      if (!item) return [];
      var selectedVals = [];
      item.querySelectorAll('.t-catalog__filter__custom-sel.active').forEach(function (el) {
        var v = (el.getAttribute('data-filter-value') || '').trim();
        if (!v) {
          var ttl = el.querySelector('.t-catalog__filter__title');
          v = (ttl ? ttl.textContent : el.textContent || '').trim();
        }
        if (v) selectedVals.push(v);
      });
      if (!selectedVals.length) return [];
      var out = [];
      selectedVals.forEach(function (v) { out = out.concat(brandsFromCoatingValue(v)); });
      return uniq(out);
    }
    function getAllowedBrands() {
      var byFilter = selectedCoatingBrands();
      if (byFilter.length) return byFilter;
      return allowed || [];
    }
    function intersects(a, b) {
      for (var i = 0; i < a.length; i++) if (b.indexOf(a[i]) !== -1) return true;
      return false;
    }
    function optionValue(el) {
      var v = (el && el.getAttribute ? el.getAttribute('data-filter-value') : '') || '';
      v = v.trim();
      if (v) return v;
      var ttl = el && el.querySelector ? el.querySelector('.t-catalog__filter__title') : null;
      return (ttl ? ttl.textContent : (el && el.textContent) || '').trim();
    }
    function selectedBrands() {
      var out = [];
      if (activeBrand && activeBrand !== 'all') out.push(activeBrand);
      var bItem = brandFilterItem();
      if (bItem) {
        bItem.querySelectorAll('.t-catalog__filter__custom-sel.active').forEach(function (el) {
          var br = brandOf(optionValue(el));
          if (br) out.push(br);
        });
      }
      return uniq(out);
    }
    function updateCrossDisable() {
      var selBrands = selectedBrands();
      var allowBrands = getAllowedBrands();

      var cItem = coatingItem();
      if (cItem) {
        cItem.querySelectorAll('.t-catalog__filter__custom-sel').forEach(function (el) {
          var isActive = el.classList.contains('active');
          var b = brandsFromCoatingValue(optionValue(el));
          var disable = false;
          if (!isActive && selBrands.length && b.length) disable = !intersects(b, selBrands);
          el.classList.toggle('nx-filter-opt--disabled', !!disable);
        });
      }

      var bItem = brandFilterItem();
      if (bItem) {
        bItem.querySelectorAll('.t-catalog__filter__custom-sel').forEach(function (el) {
          var isActive = el.classList.contains('active');
          var br = brandOf(optionValue(el));
          var disable = false;
          if (!isActive && br && allowBrands.length) disable = allowBrands.indexOf(br) === -1;
          el.classList.toggle('nx-filter-opt--disabled', !!disable);
        });
      }
    }
    var DEBUG_0C = true;
    var _lastDebugKey = '';
    function activeFilterValues(item) {
      var out = [];
      if (!item) return out;
      item.querySelectorAll('.t-catalog__filter__custom-sel.active').forEach(function (el) {
        var v = (el.getAttribute('data-filter-value') || '').trim();
        if (!v) {
          var ttl = el.querySelector('.t-catalog__filter__title');
          v = (ttl ? ttl.textContent : el.textContent || '').trim();
        }
        if (v) out.push(v);
      });
      return out;
    }
    function log0c(reason) {
      if (!DEBUG_0C || !window.console) return;
      var payload = {
        reason: reason,
        coating_context: coating || '',
        allowed_brands: getAllowedBrands(),
        active_brand_chip: activeBrand,
        active_brand_native: activeFilterValues(brandFilterItem()),
        active_coating_native: activeFilterValues(coatingItem())
      };
      var key;
      try { key = JSON.stringify(payload); } catch (e) { key = reason + '|' + (coating || ''); }
      if (key === _lastDebugKey) return;
      _lastDebugKey = key;
      console.log('[nx-pal][0c]', payload);
    }
    function blocked(brand) {
      var cur = getAllowedBrands();
      return !!(brand && brand !== 'all' && cur.length && cur.indexOf(brand) === -1);
    }
    function matched(brand) {
      var cur = getAllowedBrands();
      return !!(brand && brand !== 'all' && cur.length && cur.indexOf(brand) !== -1);
    }

    function findFilterItem(opt) {
      var byName = (opt && opt.names) || [];
      for (var i = 0; i < byName.length; i++) {
        var t = document.querySelector('.js-catalog-filter-item-title[data-filter-name="' + byName[i] + '"]');
        if (t) return t.closest('.t-catalog__filter__item');
      }
      var re = opt && opt.titleRe;
      if (!re) return null;
      var titles = document.querySelectorAll('.js-catalog-filter-item-title, .t-catalog__filter-item-title, .t-catalog__filter__title-block');
      for (var j = 0; j < titles.length; j++) {
        var txt = (titles[j].textContent || '').trim().toLowerCase();
        if (re.test(txt)) {
          var item = titles[j].closest('.t-catalog__filter__item');
          if (item) return item;
        }
      }
      return null;
    }

    /* Нативный «Тип покрытия» */
    function coatingItem() {
      return findFilterItem({
        names: ['charact:11257411'],
        titleRe: /тип\s*покрыт/i
      });
    }

    /* Нативный «Бренд» */
    function brandFilterItem() {
      return findFilterItem({
        names: ['charact:11257421'],
        titleRe: /бренд/i
      });
    }

    /* tuneFilters: 1) «Тип покрытия» — класс для чекбокс-вида + короткий лейбл;
       2) переносим «Бренд» ВЫШЕ «Тип покрытия» (физически в DOM, без CSS-order). */
    function tuneFilters() {
      var item = coatingItem();
      if (item) item.classList.add('nx-coat-filter');

      var brand = brandFilterItem();
      /* если «Бренд» идёт ПОСЛЕ «Тип покрытия» — поднимаем его перед ним */
      if (item && brand && item.parentNode === brand.parentNode &&
          (brand.compareDocumentPosition(item) & Node.DOCUMENT_POSITION_PRECEDING)) {
        brand.parentNode.insertBefore(brand, item);
      }

      if (item) {
        var longSel = item.querySelector('.t-catalog__filter__custom-sel[data-filter-value*="Пропитка гидромаслом"]');
        var ttl = longSel && longSel.querySelector('.t-catalog__filter__title');
        if (ttl && ttl.textContent.trim().length > 22) ttl.textContent = 'Пропитки, лаки, воск (Valtti)';
      }
    }

    /* Авто-применение нативных фильтров снова включено:
       данные по «Тип покрытия»/«Бренд» в Tilda размечены поштучно. */
    function hasActiveIn(item) {
      return !!(item && item.querySelector('.t-catalog__filter__custom-sel.active'));
    }
    function applyFirstMatch(item, predicate) {
      if (!item || hasActiveIn(item)) return false;
      var els = item.querySelectorAll('.t-catalog__filter__custom-sel');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        var v = (el.getAttribute('data-filter-value') || '').trim();
        if (!v) {
          var ttl = el.querySelector('.t-catalog__filter__title');
          v = (ttl ? ttl.textContent : el.textContent || '').trim();
        }
        if (predicate(v, el)) {
          el.click();
          return true;
        }
      }
      return false;
    }
    function applyNativeFiltersFromContext() {
      var coatingVal = String(coating || '').trim();
      var coatingOk = false;
      if (coatingVal) {
        var coatingLower = coatingVal.toLowerCase();
        coatingOk = applyFirstMatch(coatingItem(), function (v) {
          var x = String(v || '').toLowerCase().trim();
          return x === coatingLower || x.indexOf(coatingLower) !== -1 || coatingLower.indexOf(x) !== -1;
        });
      }

      var allowedNow = getAllowedBrands();
      if (allowedNow.length === 1) {
        var wanted = allowedNow[0];
        applyFirstMatch(brandFilterItem(), function (v) {
          return brandOf(v) === wanted;
        });
      }
      return coatingOk;
    }

    function showMsg() {
      var box = document.getElementById('nx-coat-msg');
      if (!box) {
        box = document.createElement('div');
        box.id = 'nx-coat-msg';
        box.className = 'nx-coat-msg';
      }
      box.textContent = '⚠ ' + MSG;
      /* размещаем под кастомными пилюлями, иначе под нативным деревом фильтров */
      if (!box.parentNode) {
        var host = document.getElementById('nx-coat-wrap')
                || document.querySelector('.t-catalog__parts-switch-wrapper, .t-catalog__parts-tree, .t-catalog__filter-w-parts, .t-catalog__cont-filter');
        if (host && host.parentNode) {
          host.parentNode.insertBefore(box, host.nextSibling);
        } else {
          document.body.appendChild(box);
        }
      }
      box.style.display = 'block';
    }
    function hideMsg() {
      var box = document.getElementById('nx-coat-msg');
      if (box) box.style.display = 'none';
    }

    function mark() {
      document.querySelectorAll('.nx-coat-btn').forEach(function (b) {
        var br = b.dataset.brand;
        b.classList.toggle('nx-coat-btn--disabled', blocked(br));
        b.classList.toggle('nx-coat-btn--match', matched(br));
      });
      document.querySelectorAll(NATIVE_SEL).forEach(function (a) {
        var br = nativeBrand(a);
        a.classList.toggle('nx-pal-link--disabled', blocked(br));
        a.classList.toggle('nx-pal-link--match', matched(br));
      });
      updateCrossDisable();        /* двусторонняя деактивация фильтров */
      applyBrandFilter();          /* грид по активному бренду (не по покрытию) */
      tuneFilters();               /* порядок фильтров + чекбокс-вид «Тип покрытия» */
      log0c('mark');
    }

    function optionsState(item, toKey) {
      var out = [];
      if (!item) return out;
      item.querySelectorAll('.t-catalog__filter__custom-sel').forEach(function (el) {
        var v = optionValue(el);
        out.push({
          key: toKey ? toKey(v) : v,
          value: v,
          active: el.classList.contains('active'),
          disabled: el.classList.contains('nx-filter-opt--disabled')
        });
      });
      return out;
    }

    /* перехватываем клик в capture-фазе — раньше обработчиков Tilda и пилюль */
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      var pill = t.closest('.nx-coat-btn');
      var link = t.closest(NATIVE_SEL);
      var disabledNativeOpt = t.closest('.t-catalog__filter__custom-sel.nx-filter-opt--disabled');
      if (!pill && !link && !disabledNativeOpt) return;
      if (disabledNativeOpt) {
        e.preventDefault();
        e.stopImmediatePropagation();
        showMsg();
        log0c('blocked-disabled-opt');
        return;
      }
      var brand = pill ? pill.dataset.brand : nativeBrand(link);
      if (blocked(brand)) {
        e.preventDefault();
        e.stopImmediatePropagation();   /* блокируем и переключатель Tilda */
        showMsg();
        log0c('blocked-click');
      } else {
        hideMsg();
        log0c('allowed-click');
        setTimeout(scheduleMark, 20);
      }
    }, true);

    var _markScheduled = false;
    function scheduleMark() {
      if (_markScheduled) return;
      _markScheduled = true;
      setTimeout(function () {
        _markScheduled = false;
        mark();
      }, 140);
    }
    new MutationObserver(scheduleMark).observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['class', 'style', 'aria-checked', 'checked']
    });
    /* После дорисовки фильтров применяем контекст из карточки (если есть) */
    setTimeout(function () {
      if (applyNativeFiltersFromContext()) scheduleMark();
    }, 700);
    setTimeout(mark, 600);
    mark();

    /* Debug helper для консоли:
       __nxPalDebug.report()
       __nxPalDebug.recalc() */
    window.__nxPalDebug = {
      recalc: function () { scheduleMark(); return 'scheduled'; },
      report: function () {
        var rep = {
          coating_context: coating || '',
          active_brand_chip: activeBrand,
          allowed_brands: getAllowedBrands(),
          brand_options: optionsState(brandFilterItem(), brandOf),
          coating_options: optionsState(coatingItem(), function (v) { return brandsFromCoatingValue(v); }),
          custom_brand_buttons: Array.prototype.slice.call(document.querySelectorAll('.nx-coat-btn')).map(function (b) {
            return {
              brand: b.dataset.brand || '',
              active: b.classList.contains('nx-active'),
              disabled: b.classList.contains('nx-coat-btn--disabled'),
              match: b.classList.contains('nx-coat-btn--match')
            };
          })
        };
        console.log('[nx-pal][debug-report]', rep);
        return rep;
      }
    };
  })();

  /* ══ Попап ══ */
  var popup    = document.getElementById('nx-pal-popup');
  var preview  = document.getElementById('nx-pal-preview');
  var codeEl   = document.getElementById('nx-pal-code');
  var nameEl   = document.getElementById('nx-pal-name');
  var pickWrap = document.getElementById('nx-pal-pick-wrap');
  var pickBtn  = document.getElementById('nx-pal-pick');
  var orderBtn = document.getElementById('nx-pal-order');
  var closeBtn = document.getElementById('nx-pal-close');
  var _current = null;

  /* ── Парсинг данных карточки ── */
  function parseHex(text) {
    var m = text && text.match(/\(?([0-9A-Fa-f]{6})\)?/);
    return m ? '#' + m[1].toUpperCase() : null;
  }

  function getBgImg(card) {
    var bg = card.querySelector('.t-store__card__bgimg,.t-catalog__card__bgimg,[class*="bgimg"]');
    if (!bg) return '';
    var m = (bg.style.backgroundImage || '').match(/url\(['"]?([^'")\s]+)['"]?\)/);
    return m ? m[1] : '';
  }

  function getCardData(card) {
    /* Заголовок карточки: "2661x", "Vinha 2661" и т.п. */
    var titleEl = card.querySelector(
      '.js-catalog-prod-name, .js-product-name, .t-catalog__card__title, .t-store__card__title'
    );
    var titleText = titleEl ? titleEl.textContent.trim() : '';

    /* Описание карточки: "Vinha 2661", "RAL 1013" и т.п. */
    var descrEl = card.querySelector('.t-catalog__card__descr, .t-store__card__descr');
    var descrText = descrEl ? descrEl.textContent.trim() : '';

    /* Код: первое число ("Vinha 2661" → "2661", "2683x" → "2683") */
    var m = (titleText || descrText).match(/(\d+)/);
    var code = m ? m[1] : (titleText || descrText);

    /* Имя: предпочитаем descr если есть; иначе чистим title */
    var name;
    if (descrText && descrText !== titleText) {
      name = descrText;
    } else {
      var cleaned = titleText.replace(code, '').replace(/^[\s\W]+/, '').replace(/[\s\W]+$/, '').trim();
      name = cleaned.length >= 3 ? cleaned : '';
    }

    return { code: code, name: name || code, hex: parseHex(titleText + descrText), img: getBgImg(card) };
  }

  function injectCardSwatch(card) {
    if (!card || card.querySelector('.nx-p-color-swatch')) return;
    var wrap = card.querySelector('.t-store__card__imgwrapper, .t-store__card__imgwrapper_1-1, .t-catalog__card__imgwrapper, .t-catalog__card__imgwrapper_1-1');
    if (!wrap) {
      var bg = card.querySelector('.t-store__card__bgimg, .t-catalog__card__bgimg, [class*="card__bgimg"]');
      wrap = bg && bg.parentElement ? bg.parentElement : null;
    }
    if (!wrap) return;
    wrap.style.position = wrap.style.position || 'relative';
    var data = getCardData(card);
    if (!data.code) return;
    var sw = document.createElement('div');
    sw.className = 'nx-p-color-swatch';
    var nm = document.createElement('div');
    nm.className = 'nx-p-color-swatch__name';
    var cd = document.createElement('span');
    cd.className = 'nx-p-color-swatch__code';
    cd.textContent = data.code;
    nm.appendChild(cd);
    if (data.name && data.name !== data.code) nm.appendChild(document.createTextNode(data.name));
    sw.appendChild(nm);
    wrap.appendChild(sw);
  }

  function renderCardSwatches() {
    document.querySelectorAll('.t-store__card:not(.t-store__card-preloader), .t-catalog__card:not(.t-catalog__card-preloader)')
      .forEach(injectCardSwatch);
  }

  /* ── Попап ── */
  function openPopup(data) {
    _current = data;

    if (data.img) {
      preview.style.backgroundImage = 'url(' + data.img + ')';
      preview.style.backgroundColor = data.hex || '#e0e0e0';
    } else {
      preview.style.backgroundImage = '';
      preview.style.backgroundColor = data.hex || '#e0e0e0';
    }
    preview.innerHTML = '';
    var sw = document.createElement('div');
    sw.className = 'nx-p-color-swatch';
    var nm = document.createElement('div');
    nm.className = 'nx-p-color-swatch__name';
    var cd = document.createElement('span');
    cd.className = 'nx-p-color-swatch__code';
    cd.textContent = data.code || '';
    nm.appendChild(cd);
    if (data.name && data.name !== data.code) nm.appendChild(document.createTextNode(data.name));
    sw.appendChild(nm);
    preview.appendChild(sw);

    codeEl.textContent = data.code;
    nameEl.textContent = (data.name && data.name !== data.code) ? data.name : '';

    /* Блок «Выбрать для товара» — только при возврате на карточку */
    var hasBack = !!sessionStorage.getItem('nx_palette_back');
    pickWrap.style.display = hasBack ? '' : 'none';

    /* Заполняем контекст товара внутри попапа */
    if (hasBack) {
      var popupCtx      = document.getElementById('nx-popup-ctx');
      var popupCtxName  = document.getElementById('nx-popup-ctx-name');
      var popupCtxCoat  = document.getElementById('nx-popup-ctx-coat');
      var productCtx = null;
      try { productCtx = JSON.parse(sessionStorage.getItem('nx_palette_product') || 'null'); } catch (e) {}
      if (popupCtx && productCtx && productCtx.name) {
        if (popupCtxName) popupCtxName.textContent = productCtx.name;
        if (popupCtxCoat) popupCtxCoat.textContent = productCtx.coating ? 'Покрытие: ' + productCtx.coating : '';
        popupCtx.style.display = '';
      }
    }

    popup.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closePopup() {
    popup.style.display = 'none';
    document.body.style.overflow = '';
    _current = null;
  }

  function showToast(msg) {
    var t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);' +
      'background:#4C9E24;color:#fff;padding:12px 24px;border-radius:10px;' +
      'font-size:14px;font-weight:600;z-index:10000;box-shadow:0 4px 20px rgba(0,0,0,.25);' +
      'white-space:nowrap;pointer-events:none;font-family:inherit;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3000);
  }

  /* ── Кнопки попапа ── */
  pickBtn.addEventListener('click', function () {
    if (!_current) return;
    try { sessionStorage.setItem('nx_palette_color', JSON.stringify(_current)); } catch (e) {}
    history.back();
  });

  orderBtn.addEventListener('click', function () {
    if (!_current) return;
    try { sessionStorage.setItem('nx_palette_color', JSON.stringify(_current)); } catch (e) {}
    var label = [_current.code,
      (_current.name && _current.name !== _current.code) ? _current.name : ''
    ].filter(Boolean).join(' — ');
    try {
      if (typeof tcart__addProduct === 'function') {
        /* Выкрас — ручная позиция 0 ₽ без складского uid (иначе NOT FOUND PRODUCTS IN STORE) */
        var sampleItem = { name: 'Пробный выкрас — ' + label, price: 0, quantity: 1, amount: 0, img: _current.img || '', uid: '306044934692', option: 'Цвет: ' + label };
        console.log('nx: sample to cart', JSON.stringify(sampleItem));
        tcart__addProduct(sampleItem);
      }
    } catch (e) { console.error('nx: tcart', e); }
    closePopup();
    showToast('«' + _current.code + '» добавлен в корзину');
  });

  closeBtn.addEventListener('click', closePopup);
  popup.addEventListener('click', function (e) { if (e.target === popup) closePopup(); });

  /* ── Event delegation на document (capture) ──────────────────────────────
     e.isTrusted — блокирует синтетические клики Tilda при инициализации каталога
     (именно они вызывали автооткрытие попапа при загрузке страницы).
  ──────────────────────────────────────────────────────────────────────── */
  document.addEventListener('click', function (e) {
    if (!e.isTrusted) return; /* только настоящие клики пользователя */
    if (location.pathname.indexOf('/palitra') !== 0) return;
    if (popup.contains(e.target)) return;

    var card = e.target.closest('.t-store__card, .t-catalog__card');
    if (!card) return;

    e.preventDefault();
    e.stopImmediatePropagation();
    openPopup(getCardData(card));
  }, true); /* capture: перехватываем до навигации Tilda */

  renderCardSwatches();
  setTimeout(renderCardSwatches, 500);
  setTimeout(renderCardSwatches, 1300);
  if (window.MutationObserver) {
    var _swatchScheduled = false;
    function scheduleSwatches() {
      if (_swatchScheduled) return;
      _swatchScheduled = true;
      setTimeout(function () {
        _swatchScheduled = false;
        renderCardSwatches();
      }, 140);
    }
    new MutationObserver(scheduleSwatches).observe(document.body, { childList: true, subtree: true });
  }

})();
</script>

<script>
/* ══ Раскраска свотчей фильтра «Цвет» на /palitra ══
   У значений фильтра (беж, бордо, голубой…) в Tilda не задан оттенок —
   кружки пустые. Красим их по названию. Оттенки совпадающих цветов взяты
   из реального фильтра каталога (коды покрытий); голубой/синий/зелёный — подобраны. */
(function () {
  var MAP = {
    'беж': '#F0E3C8', 'белый': '#F3F3EE', 'бордо': '#703848', 'голубой': '#9CC3DB',
    'желтый': '#DCA658', 'жёлтый': '#DCA658', 'зеленый': '#5A9E4B', 'зелёный': '#5A9E4B',
    'коричневый': '#805040', 'красный': '#A83C48', 'оранжевый': '#D08848', 'серый': '#9A9898',
    'синий': '#2F4FA0', 'темно-зеленый': '#2E5A36', 'тёмно-зелёный': '#2E5A36', 'фиолетовый': '#AF76B3'
  };
  function name(el) {
    var inp = el.querySelector('input[data-filter-value]');
    var v = el.getAttribute('aria-label') || el.getAttribute('data-tooltip') ||
            (inp && inp.getAttribute('data-filter-value')) || el.textContent || '';
    return (v + '').trim().toLowerCase();
  }
  function paint() {
    document.querySelectorAll('.t-catalog__filter__checkbox_color').forEach(function (el) {
      var nm = name(el);
      var hex = MAP[nm];
      if (hex) {
        /* заливка — красим кружок-индикатор, как в каталоге (.checkmark_color) */
        var dot = el.querySelector('.t-catalog__filter__checkmark_color, .t-catalog__filter__checkmark, .t-checkbox__indicator');
        if (dot) dot.style.setProperty('background-color', hex, 'important');
        else el.style.setProperty('background-color', hex, 'important');
      }
      /* название оттенка — только в тултипе при наведении (подпись под свотчем НЕ показываем) */
      if (nm) {
        el.setAttribute('data-tooltip', nm);
        el.setAttribute('aria-label', nm);
        el.setAttribute('title', nm);
      }
    });
    /* скрыть фильтр «Цена» — у палитры цены 0, он бесполезен (0–0) */
    document.querySelectorAll('.t-catalog__filter__item').forEach(function (item) {
      var isPrice = !!item.querySelector('.t-catalog__filter__slider, .t-rangeslider, input[type="range"], input[name*="price"], [class*="filter__range"]');
      if (!isPrice) {
        var h = item.querySelector('.t-catalog__filter__title-block, [class*="filter__heading"], [class*="filter__title-block"], [class*="filter__opt-title"]');
        if (h && (h.textContent || '').trim().toLowerCase().indexOf('цена') === 0) isPrice = true;
      }
      if (isPrice) item.style.setProperty('display', 'none', 'important');
    });
  }
  var _paintScheduled = false;
  function schedulePaint() {
    if (_paintScheduled) return;
    _paintScheduled = true;
    setTimeout(function () {
      _paintScheduled = false;
      paint();
    }, 120);
  }
  paint();
  if (window.MutationObserver) new MutationObserver(schedulePaint).observe(document.body, { childList: true, subtree: true });
})();
</script>
