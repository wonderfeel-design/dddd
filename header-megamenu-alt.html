  html body .artm a,

  var mobTabs    = document.getElementById('artmMobTabs');
  var mobContent = document.getElementById('artmMobContent');
  var mobIcon    = document.getElementById('artmMobIcon');

  var ICON_MENU = '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>';
  var ICON_X    = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';

  function svgEl(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }
  function chevron() {
    var svg = svgEl('svg');
    svg.setAttribute('width','13'); svg.setAttribute('height','13');
    svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('fill','none');
    svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','2.5');
    svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round');
    var poly = svgEl('polyline'); poly.setAttribute('points','9 18 15 12 9 6');
    svg.appendChild(poly); return svg;
  }

  /* ── Десктоп: пункты навигации (наведение — открыть панель, клик — перейти) ── */
  CATALOG.forEach(function(cat) {
    var a = document.createElement('a');
    a.className = 'artm-nav-link';
    a.textContent = cat.label;
    a.href = cat.href;
    a.dataset.key = cat.key;
    a.addEventListener('mouseenter', function() {
      clearTimeout(closeTimer);
      activePanel = cat.key; openMenu(); renderSidebar(); renderContent();
    });
    navLinks.appendChild(a);
  });

  /* ── Десктоп: сайдбар ── */
  function renderSidebar() {
    sidebar.innerHTML = '';
    CATALOG.forEach(function(cat) {
      var a = document.createElement('a');
      a.className = 'artm-sidebar-btn' + (cat.key === activePanel ? ' active' : '');
      a.href = cat.href;
      var span = document.createElement('span'); span.textContent = cat.label;
      a.appendChild(span); a.appendChild(chevron());
      a.addEventListener('mouseenter', function() {
        activePanel = cat.key; renderSidebar(); renderContent(); updateNavActive();
      });
      sidebar.appendChild(a);
    });
  }

  /* ── Десктоп: ряды-ромбы ── */
  function renderContent() {
    content.innerHTML = '';
    var cat = CATALOG.find(function(c){ return c.key === activePanel; });
    if (!cat) return;
    cat.subCats.forEach(function(sub) { content.appendChild(buildRow(sub)); });
  }

  function buildRow(sub) {
    var N = sub.items.length, segW = 100 / N;
    var wrap = document.createElement('div');

    var head = document.createElement('a');
    head.className = 'artm-row-heading'; head.href = sub.href;
    var lbl = document.createElement('div');
    lbl.className = 'artm-row-label'; lbl.textContent = sub.heading;
    head.appendChild(lbl); wrap.appendChild(head);

    var strip = document.createElement('div');
    strip.className = 'artm-row-strip'; wrap.appendChild(strip);

    sub.items.forEach(function(item, i) {
      var isFirst = i === 0, isLast = i === N - 1;
      var tL = isFirst ? 0 : i * segW + GAP;
      var tR = isLast  ? 100 : (i + 1) * segW - GAP;
      var bL = isFirst ? 0 : tL - SKEW;
      var bR = isLast  ? 100 : tR - SKEW;
      var clip = 'polygon('+tL+'% 0%,'+tR+'% 0%,'+bR+'% 100%,'+bL+'% 100%)';
      var cx = (bL + bR) / 2;

      var seg = document.createElement('a');
      seg.className = 'artm-seg'; seg.href = item.h;
      seg.style.clipPath = clip;

      var bg = document.createElement('div');
      bg.className = 'artm-seg-bg';
      bg.style.backgroundImage = 'url('+item.image+')';
      seg.appendChild(bg);

      var tint = document.createElement('div');
      tint.className = 'artm-seg-tint'; seg.appendChild(tint);

      var lbl2 = document.createElement('div');
      lbl2.className = 'artm-seg-label';
      lbl2.style.left = 'calc('+cx+'% - 54px)';
      lbl2.textContent = item.name; seg.appendChild(lbl2);

      strip.appendChild(seg);
    });

    var svg = svgEl('svg'); svg.setAttribute('class','artm-svg-lines');
    for (var i = 0; i < N - 1; i++) {
      var x1 = (i + 1) * segW, x2 = x1 - SKEW;
      var line = svgEl('line');
      line.setAttribute('x1', x1+'%'); line.setAttribute('y1','0%');
      line.setAttribute('x2', x2+'%'); line.setAttribute('y2','100%');
      line.setAttribute('stroke','rgba(255,255,255,.22)'); line.setAttribute('stroke-width','1');
      svg.appendChild(line);
    }
    strip.appendChild(svg);
    return wrap;
  }

  /* ── Десктоп: открыть / закрыть ── */
  function openMenu() {
    menuOpen = true; panel.classList.add('open'); updateNavActive();
  }
  function closeMenu() {
    menuOpen = false; panel.classList.remove('open'); updateNavActive();
  }
  function updateNavActive() {
    navLinks.querySelectorAll('.artm-nav-link').forEach(function(b) {
      b.classList.toggle('active', menuOpen && b.dataset.key === activePanel);
    });
  }
  catalogBtn.addEventListener('click', function() { menuOpen ? closeMenu() : openMenu(); });
  /* Закрытие при уходе мыши со всего меню */
  root.addEventListener('mouseleave', function() {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(closeMenu, 150);
  });
  root.addEventListener('mouseenter', function() { clearTimeout(closeTimer); });
  document.addEventListener('click', function(e) {
    if (menuOpen && !e.target.closest('.artm')) closeMenu();
  });

  /* ── Мобайл: табы ── */
  function renderMobTabs() {
    mobTabs.innerHTML = '';
    CATALOG.forEach(function(cat) {
      var btn = document.createElement('button');
      btn.className = 'artm-mob-tab' + (cat.key === activePanel ? ' active' : '');
      btn.textContent = cat.label; btn.dataset.key = cat.key;
      btn.addEventListener('click', function() {
        activePanel = cat.key; renderMobTabs(); renderMobContent();
      });
      mobTabs.appendChild(btn);
    });
  }
  function renderMobContent() {
    mobContent.innerHTML = '';
    var cat = CATALOG.find(function(c){ return c.key === activePanel; });
    if (!cat) return;
    cat.subCats.forEach(function(sub) {
      var secLbl = document.createElement('a');
      secLbl.className = 'artm-mob-section-label';
      secLbl.href = sub.href; secLbl.textContent = sub.heading;
      mobContent.appendChild(secLbl);

      var grid = document.createElement('div'); grid.className = 'artm-mob-grid';
      sub.items.forEach(function(item) {
        var card = document.createElement('a');
        card.className = 'artm-mob-card'; card.href = item.h;
        var cbg = document.createElement('div');
        cbg.className = 'artm-mob-card-bg';
        cbg.style.backgroundImage = 'url('+item.image+')';
        var cgrad = document.createElement('div'); cgrad.className = 'artm-mob-card-grad';
        var clbl = document.createElement('div');
        clbl.className = 'artm-mob-card-label'; clbl.textContent = item.name;
        card.appendChild(cbg); card.appendChild(cgrad); card.appendChild(clbl);
        grid.appendChild(card);
      });
      mobContent.appendChild(grid);
    });
  }
  mobBtn.addEventListener('click', function() {
    mobOpen = !mobOpen;
    mobPanel.classList.toggle('open', mobOpen);
    mobIcon.innerHTML = mobOpen ? ICON_X : ICON_MENU;
    if (mobOpen) { renderMobTabs(); renderMobContent(); }
  });

  /* ── Init ── */
  renderSidebar();
  renderContent();

  /* ── Sticky: как в основном меню (header.html) ──────────────
     В покое бар в потоке; при прокрутке фиксируем его ровно под плавающей
     шапкой Tilda. Высоту шапки определяем автоматически. */
  (function initSticky() {
    if (!root) return;
    function getHeaderH() {
      var h = 0;
      ['.tmenu-mobile_positionfixed', '.t-menu-base_positionfixed'].forEach(function (sel) {
        var el = document.querySelector(sel);
        if (el && getComputedStyle(el).position === 'fixed' && el.offsetHeight > 0)
          h = Math.max(h, el.offsetHeight);
      });
      if (h > 0) return h;
      document.querySelectorAll('.t-rec').forEach(function (rec) {
        var st = getComputedStyle(rec);
        if (st.position === 'fixed' && parseFloat(st.top) <= 0 && rec.offsetHeight > 0)
          h = Math.max(h, rec.offsetHeight);
      });
      if (h > 0) return h;
      try {
        var els = (document.getElementById('allrecords') || document.body).querySelectorAll('*');
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          if (el === root || root.contains(el)) continue;
          var st = getComputedStyle(el);
          if (st.position !== 'fixed' || el.offsetHeight < 6 || el.offsetHeight > 250) continue;
          var rect = el.getBoundingClientRect();
          if (rect.top >= -5 && rect.top <= 5) h = Math.max(h, el.offsetHeight);
        }
      } catch (err) {}
      return h || 80;
    }
    var spacer = document.createElement('div');
    spacer.style.cssText = 'display:none;height:' + root.offsetHeight + 'px;';
    root.parentNode.insertBefore(spacer, root);
    function applySticky() {
      var hdrH = getHeaderH();
      document.documentElement.style.setProperty('--artm-header-h', hdrH + 'px');
      var offsetTop = spacer.getBoundingClientRect().top + window.scrollY;
      var shouldStick = window.scrollY >= offsetTop - hdrH;
      if (shouldStick && !root.classList.contains('artm-sticky')) {
        root.classList.add('artm-sticky'); spacer.style.display = 'block';
      } else if (!shouldStick && root.classList.contains('artm-sticky')) {
        root.classList.remove('artm-sticky'); spacer.style.display = 'none';
      }
    }
    window.addEventListener('scroll', applySticky, { passive: true });
    var rt = null;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { spacer.style.height = root.offsetHeight + 'px'; applySticky(); }, 150);
    });
    applySticky();
    setTimeout(applySticky, 300);
    setTimeout(applySticky, 800);
  })();
})();
</script>
