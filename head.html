<script>
if (location.pathname.indexOf('/tproduct/') !== -1) {
  document.documentElement.classList.add('nx-tp');
  /* Safety: if our custom render never completes within 3s (API error, JS
     exception before the catch handler), reveal native recs so the page
     isn't stuck blank. If render succeeded, window._nxProdRendered is true
     and native recs (which hold the real product widget) must stay hidden —
     removing nx-tp here would un-hide them and duplicate the title/image. */
  setTimeout(function () {

  }, 3000);

<script>
/* ══ Скрытие ошибки заказа склада ══
   Прячем сообщение корзины только если это ошибка склада/заказа
   (Order error / NOT FOUND PRODUCTS IN STORE), не трогая валидацию полей.
   Наблюдатель вешается ЛЕНИВО — только после первого взаимодействия с корзиной,
   и на контейнер корзины (.t706), а не на весь body. На главной/каталоге, где
   корзину не открывали, не выполняется ничего (экономия на каждой загрузке). */
(function () {
  if (!window.MutationObserver) return;
  var _scheduled = false, _attached = false;
  function hideStoreOrderError() {
    var boxes = document.querySelectorAll('.t-form__errorbox-text, .t-store__error, .js-errorbox-all, .t-form__errorbox');
    for (var i = 0; i < boxes.length; i++) {
      var t = (boxes[i].textContent || '').toLowerCase();
      if (t.indexOf('order error') !== -1 || t.indexOf('not found') !== -1 ||
          t.indexOf('booking') !== -1 || t.indexOf('склад') !== -1) {
        boxes[i].style.setProperty('display', 'none', 'important');
      }
    }
  }
  function scheduleHide() {
    if (_scheduled) return;
    _scheduled = true;
    setTimeout(function () { _scheduled = false; hideStoreOrderError(); }, 120);
  }
  function attach() {
    if (_attached) return;
    _attached = true;
    var host = document.querySelector('.t706') || document.body;
    new MutationObserver(scheduleHide).observe(host, { childList: true, subtree: true });
    hideStoreOrderError();
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest('a[href="#opencart"], .t706__carticon, .t-menuwidgeticons__link_cart')) attach();
  }, true);
})();
</script>

<script>
/* ══ Каталог: дерево разделов + крошки + «показать все товары» ══
   Только на /catalog. Задачи (согласовано с клиентом):
   1) дерево разделов слева — держать ВСЕГДА полностью развёрнутым (все ветки,
      не только текущая) и подсвечивать активный пункт зелёным. Нативный Tilda
      после перехода по ссылке (из верхнего меню, мегаменю или из самого
      дерева) перерисовывает сайдбар через AJAX и сворачивает его до одной
      строки «Все товары» — раскрывают только маленькие стрелки-тумблеры,
      которые такой перерисовки не вызывают;
   2) в хлебных крошках убрать лишний пункт «Все» (оставить «Все товары»),
      остальной путь строит сама Tilda — не трогаем;
   3) сразу показывать все товары — автоматически дожимать «Показать ещё».
   DOM Tilda-дерева точных имён классов не гарантирует → селекторы по подстроке
   + мягкие фолбэки; всё не разрушающее (нет узла — просто ничего не делает).
   Наблюдатели короткоживущие: разворачиваются на 5–8 секунд после триггера
   (первичный рендер / клик по каталожной ссылке / popstate), затем
   отключаются — не держим вечный observer. */
(function () {
  'use strict';
  if (location.pathname.indexOf('/catalog') !== 0) return;

  var CUR = 'nx-tree-current';

  function treeRoot() {
    return document.querySelector('.js-catalog-filter-tree-container') ||
           document.querySelector('.t-catalog__sidebar');
  }
  function isHidden(el) {
    return !el || (el.offsetParent === null && getComputedStyle(el).position !== 'fixed') ||
           getComputedStyle(el).display === 'none';
  }
  function linkPath(a) {
    try { return new URL(a.getAttribute('href'), location.origin).pathname; }
    catch (e) { return a.getAttribute('href') || ''; }
  }

  /* 1а. Раскрыть ВСЕ ветки дерева целиком (не только активную) */
  function expandAll() {
    var root = treeRoot();
    if (!root) return;
    root.querySelectorAll('[class*="filter-tree-item"]').forEach(function (node) {
      node.classList.add('t-catalog__filter-tree-item_opened', 'nx-tree-open');
      node.querySelectorAll(':scope > ul, :scope > [class*="tree-list"], :scope > [class*="tree"][class*="sub"], :scope > [class*="children"]').forEach(function (sub) {
        if (isHidden(sub)) sub.style.setProperty('display', 'block', 'important');
      });
    });
  }

  /* 1б. Подсветить активный пункт (раскрытием занимается expandAll выше) */
  function highlightActive() {
    var root = treeRoot();
    if (!root) return;

    var uidMatch = location.pathname.match(/\/catalog\/(\d+)/);
    var uid = uidMatch ? uidMatch[1] : null;
    var path = decodeURIComponent(location.pathname);

    // активный пункт: нативный active-класс → по uid → по совпадению пути
    var active = root.querySelector('[class*="filter-tree-label"][class*="active"]') ||
                 (uid && root.querySelector('a[href*="' + uid + '"], [data-partuid="' + uid + '"], [data-product-part-uid="' + uid + '"]'));
    if (!active) {
      var links = root.querySelectorAll('a[href]');
      for (var i = 0; i < links.length; i++) {
        if (linkPath(links[i]) === path) { active = links[i]; break; }
      }
    }
    // нормализуем до элемента-лейбла
    if (active && !/filter-tree-label/.test(active.className)) {
      active = active.closest('[class*="filter-tree-label"]') || active;
    }

    root.querySelectorAll('.' + CUR).forEach(function (n) { if (n !== active) n.classList.remove(CUR); });
    if (active) active.classList.add(CUR);
  }

  /* 2. Убрать пункт «Все» из хлебных крошек (не трогая «Все товары») */
  function trimCrumbs() {
    document.querySelectorAll('.t-catalog__breadcrumbs-item').forEach(function (it) {
      if ((it.textContent || '').trim() !== 'Все') return;
      var next = it.nextElementSibling, prev = it.previousElementSibling;
      if (next && /breadcrumbs-divider/.test(next.className || '')) next.remove();
      else if (prev && /breadcrumbs-divider/.test(prev.className || '')) prev.remove();
      it.remove();
    });
  }

  /* 3. Сразу показывать все товары — дожать «Показать ещё» (если есть) */
  var _lmTries = 0;
  function clickLoadMore() {
    if (_lmTries++ > 20) return;
    var scope = document.querySelector('.t-catalog__cont-wrapper') || document;
    var cand = scope.querySelectorAll('a, button, [class*="load-more"], [class*="loadmore"], .t-store__load-more');
    for (var i = 0; i < cand.length; i++) {
      var b = cand[i];
      if (b.offsetParent === null) continue;
      if (/(показать|загрузить)\s+ещ[её]/i.test((b.textContent || '').trim())) {
        b.click();
        setTimeout(clickLoadMore, 800);
        return;
      }
    }
  }

  function apply() {
    try { expandAll(); } catch (e) {}
    try { highlightActive(); } catch (e) {}
    try { trimCrumbs(); } catch (e) {}
  }

  /* Держим apply() активным на протяжении ms после триггера — одноразового
     отложенного вызова недостаточно: AJAX-перерисовка сайдбара/списка после
     перехода по каталогу может занять больше одного «тика» и переиграть
     нашу правку обратно в свёрнутое состояние. */
  var _watchTimer = null;
  function watchAndApply(host, ms) {
    apply();
    var scheduled = false;
    var obs = new MutationObserver(function () {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(function () { scheduled = false; apply(); });
    });
    obs.observe(host, { childList: true, subtree: true });
    clearTimeout(_watchTimer);
    _watchTimer = setTimeout(function () { try { obs.disconnect(); } catch (e) {} }, ms);
  }

  function start() {
    if (!document.body) return;
    var host = document.getElementById('allrecords') || document.body;
    clickLoadMore();
    watchAndApply(host, 8000);

    /* Любой переход по каталогу — клик в дереве/крошках, ИЛИ по любой ссылке
       на /catalog (верхнее меню, мегаменю, карточки) — Tilda может
       перерисовать сайдбар не мгновенно, поэтому вместо одного отложенного
       apply() держим короткий наблюдатель на document (клик может прийти
       откуда угодно на странице, не только из #allrecords). */
    document.addEventListener('click', function (e) {
      var inTree = e.target.closest('[class*="filter-tree"], .t-catalog__breadcrumbs');
      var a = e.target.closest('a[href]');
      if (!inTree && !(a && linkPath(a).indexOf('/catalog') === 0)) return;
      watchAndApply(host, 5000);
    }, true);
    window.addEventListener('popstate', function () { watchAndApply(host, 5000); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

<script>
/* Общий парсер цены — один на §2 (карточки) и §3 (страница товара). */
function nxParsePrice(n) { return parseFloat(String(n || 0).replace(/\s/g, '').replace(',', '.')) || 0; }

/* ══ 2. Карточки — унифицированное обогащение (все страницы) ══ */
(function () {
  function qs(card) {
    var args = Array.prototype.slice.call(arguments, 1);
    for (var i = 0; i < args.length; i++) { var el = card.querySelector(args[i]); if (el) return el; }
    return null;
  }
  var parsePrice = nxParsePrice;

  function injectCategoryBadge(card) {
    if (card.querySelector('.nx-cat-badge')) return;
    var title = qs(card, '.t-catalog__card__title', '.t-store__card__title', '[class*="card__title"]');
    if (!title) return;
    var text = title.textContent;
    var cat = /вагонк/i.test(text)   ? 'Вагонка'
            : /блок.хаус/i.test(text) ? 'Блок-хаус'
            : /имитац/i.test(text)    ? 'Имитация бруса'
            : /планк/i.test(text)     ? 'Планкен'
            : /термо/i.test(text)     ? 'Термодерево' : '';
    if (!cat) return;
    var badge = document.createElement('div');
    badge.className = 'nx-cat-badge';
    badge.textContent = cat;
    var wrapper = qs(card, '.t-catalog__card__imgwrapper', '.t-store__card__imgwrapper', '[class*="imgwrapper"]');
    if (wrapper) wrapper.appendChild(badge);
  }

  function injectSize(card) {
    if (card.querySelector('.nx-size-row')) return;
    var title = qs(card, '.t-catalog__card__title', '.t-store__card__title', '[class*="card__title"]');
    if (!title) return;
    var m = title.textContent.match(/(\d+)[хx×](\d+)[хx×](\d+)/i);
    if (!m) return;
    var sizeRow = document.createElement('div');
    sizeRow.className = 'nx-size-row';
    sizeRow.innerHTML = '<strong>Размер:</strong> ' + m[1] + '×' + m[2] + '×' + m[3];
    title.parentNode.insertBefore(sizeRow, title.nextSibling);
  }

  function injectDualPrice(card) {
    if (card.querySelector('.nx-price-block')) return;
    var priceEl = qs(card, '.t-catalog__card__price-value', '.t-store__card__price-value', '[class*="price-value"]');
    if (!priceEl) return;
    var priceEach = parsePrice(priceEl.textContent);
    if (!priceEach) return;
    var sqmSelect = card.querySelector('[data-edition-option-id="Цена за кв метр"] select');
    var priceSqm  = sqmSelect ? parsePrice(sqmSelect.value) : parsePrice(card.getAttribute('data-price-sqm'));
    var oldPriceEl = qs(card,
      '.t-catalog__card__price_old .t-catalog__card__price-value',
      '.t-store__card__price_old .t-store__card__price-value'
    );
    var oldPrice = oldPriceEl ? parsePrice(oldPriceEl.textContent) : 0;
    var oldRowHtml = '';
    if (oldPrice > priceEach) {
      var pct = Math.round((1 - priceEach / oldPrice) * 100);
      oldRowHtml = '<div class="nx-price-old-row"><span class="nx-price-extra__old">' + oldPrice.toLocaleString('ru') + ' ₽</span><span class="nx-price-extra__badge">-' + pct + '%</span></div>';
    }
    var nativePrice = qs(card, '.t-catalog__card__price-wrapper', '.t-store__card__price-wrapper', '.t-store__card__price', '.t-catalog__card__price');
    if (nativePrice) nativePrice.style.display = 'none';
    var block = document.createElement('div');
    block.className = 'nx-price-block';
    block.innerHTML = '<div class="nx-price-row"><div class="nx-price-col"><span class="nx-price-label">Цена за шт.:</span><span class="nx-price-val-main">' + priceEach.toLocaleString('ru') + ' ₽</span></div>' +
      (priceSqm ? '<div class="nx-price-col"><span class="nx-price-label">Цена за кв.м.:</span><span class="nx-price-val-main">' + priceSqm.toLocaleString('ru') + ' ₽</span></div>' : '') +
      '</div>' + oldRowHtml;
    var textWrap = qs(card, '.t-catalog__card__textwrapper', '.t-store__card__textwrapper', '[class*="textwrapper"]');
    if (textWrap) textWrap.appendChild(block);
  }

  function initHoverPhoto(card) {
    if (card.dataset.nxHover) return;
    card.dataset.nxHover = '1';
    var imgs = card.querySelectorAll('.t-catalog__card__bgimg, .t-store__card__bgimg, [class*="card__bgimg"]');
    if (imgs.length < 2) return;
    var main = imgs[0], hover = imgs[1];
    hover.style.opacity = '0'; hover.style.transition = 'opacity 0.2s';
    card.addEventListener('mouseenter', function () { main.style.opacity = '0'; hover.style.opacity = '1'; });
    card.addEventListener('mouseleave', function () { main.style.opacity = '1'; hover.style.opacity = '0'; });
  }

  function injectDeliveryInfo(card) {
    if (location.pathname.indexOf('/palitra') === 0) return;
    if (card.querySelector('.nx-delivery-row')) return;
    var wrap = qs(card, '.t-catalog__card__wrap_txt-and-btns', '.t-store__card__wrap_txt-and-btns');
    if (!wrap) return;
    var row = document.createElement('div');
    row.className = 'nx-delivery-row';
    row.innerHTML =
      '<div class="nx-delivery-item">Есть самовывоз сегодня</div>' +
      '<div class="nx-delivery-item">Доставка сегодня или завтра</div>';
    wrap.appendChild(row);
  }

  function processCards() {
    document.querySelectorAll('.t-catalog__card:not([data-nx-enriched]), .t-store__card:not([data-nx-enriched])').forEach(function (card) {
      card.setAttribute('data-nx-enriched', '1');
      injectCategoryBadge(card); injectSize(card); injectDualPrice(card); initHoverPhoto(card); injectDeliveryInfo(card);
    });
  }
  function scheduleProcessCards(delay) {
    setTimeout(function () {
      if (typeof window.requestIdleCallback === 'function') {
        window.requestIdleCallback(function () { processCards(); }, { timeout: 700 });
      } else {
        processCards();
      }
    }, delay || 0);
  }

  window._nxProcessCards = processCards;

  /* Раньше: 3 «слепых» прохода по всему документу (0/800/2000 мс). Теперь: один
     проход + наблюдатель ТОЛЬКО на грид-контейнерах (childList), который ловит
     lazy-подгружаемые Tilda-карточки и отключается через 8 с. Если грида ещё нет
     или нет MutationObserver — подстраховка прежними таймерами. */
  function initCardEnrichment() {
    processCards();
    var grids = document.querySelectorAll('.js-store-grid-cont, .js-catalog-grid-cont, .t-store__card-list, .t-catalog__card-list');
    if (!window.MutationObserver || !grids.length) {
      scheduleProcessCards(800); scheduleProcessCards(2000);
      return;
    }
    var _sched = false;
    function run() { if (_sched) return; _sched = true; setTimeout(function () { _sched = false; processCards(); }, 120); }
    var obs = new MutationObserver(run);
    Array.prototype.forEach.call(grids, function (g) { obs.observe(g, { childList: true }); });
    setTimeout(function () { try { obs.disconnect(); } catch (e) {} }, 8000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initCardEnrichment);
  else initCardEnrichment();
})();

/* ══ 3. Страница товара /tproduct/ ══ */
(function () {
  if (location.pathname.indexOf('/tproduct/') === -1) return;

  var STORE_UID   = '650833272852';
  var CATALOG_REC = '2362174763';

  var _p            = null;
  var _editions     = [];
  var _selected     = {};
  var _qty          = 1;
  var _boardLen     = 6;
  var _isBoard      = true;
  var _genericAttrKeys = [];
  var _paletteColor = null;

  var parsePrice = nxParsePrice;
  function fmt(n) { return parsePrice(n).toLocaleString('ru'); }

  function matchBase(e) {
    var edCoating = COATING_MAP[_selected['Тип покрытия'] || ''];
    var noCovering = edCoating ? !!_noColorCoatings[edCoating] : false;
    if (!_paletteColor && !noCovering && _selected['Цвет'] && e['Цвет'] !== undefined && e['Цвет'] !== _selected['Цвет']) return false;
    if (_selected['Ширина (мм)'] && e.pack_y && String(e.pack_y) !== _selected['Ширина (мм)']) return false;
    if (_selected['Длина'] && e.pack_x && String(e.pack_x) !== _selected['Длина']) return false;
    for (var i = 0; i < _genericAttrKeys.length; i++) {

    if (!coatingProp) return 0;
    var line = coatingProp.values.split('\n').find(function (v) { return v.split('=')[0].trim() === selectedCoating; }) || '';
    var m = line.match(/=\+?(\d+)/);

  function normalizeImageSrc(src) {
    if (src == null) return '';
    var s = String(src).trim();
    if (!s || s === 'undefined' || s === 'null') return '';
    if (/[\r\n]/.test(s)) return '';
    if (s.indexOf('javascript:') === 0) return '';
    if (
      s.indexOf('http://') === 0 ||
      s.indexOf('https://') === 0 ||
      s.indexOf('//') === 0 ||
      s.indexOf('/') === 0 ||
      s.indexOf('./') === 0 ||
      s.indexOf('../') === 0 ||
      s.indexOf('data:image/') === 0 ||
      s.indexOf('blob:') === 0
    ) return s;
    return '';
  }

  function ensureMainImagePreload(src) {
    var safeSrc = normalizeImageSrc(src);
    if (!safeSrc) return;
    /* Reject anything the URL parser itself can't resolve — avoids Chrome's
       "invalid href" console warning when Tilda's gallery data has a
       malformed/partial path (data: URLs excluded, they aren't real URLs). */
    if (safeSrc.indexOf('data:') !== 0) {
      try { new URL(safeSrc, location.href); } catch (e) { return; }
    }
    var head = document.head || document.getElementsByTagName('head')[0];
    if (!head) return;
    var ln = document.getElementById('nx-preload-mainimg');
    if (!ln) {
      ln = document.createElement('link');
      ln.id = 'nx-preload-mainimg';
      ln.rel = 'preload';
      ln.as = 'image';
      ln.fetchPriority = 'high';
      head.appendChild(ln);
    }
    if (ln.href !== safeSrc) ln.href = safeSrc;
  }

function addToCart() {
  if (!_p) return;
  var ed = getEd();

  /* Страховка: палитровый цвет не должен уйти в корзину с несовместимым
     покрытием (например, Valtti-цвет при «Укрывной»). Если рассинхрон —
     сбрасываем палитровый цвет, в корзину идёт реальное издание. */
  if (_paletteColor && ed && !nxPaletteFitsCoating(_paletteColor, ed['Покрытие'])) {
    clearPaletteColor();
  }

  // Установить цвет ДО формирования optParts
  if (ed && ed['Покрытие'] === 'Без покрытия') {
    _selected['Цвет'] = 'без';
  }

  var price = parsePrice(ed ? ed.price : _p.price) + getCoatingDelta();
  var img = (_paletteColor && _paletteColor.img) ? _paletteColor.img
            : (ed && ed.img) ? ed.img : '';

var paletteLabel = _paletteColor
  ? (_paletteColor.code + (_paletteColor.name && _paletteColor.name !== _paletteColor.code ? ' ' + _paletteColor.name : ''))
  : '';

var colorLabel = _paletteColor
  ? ('Цвет из палитры: ' + paletteLabel)
  : (ed && ed['Цвет'] && ed['Цвет'] !== 'без' && String(ed['Цвет']) !== 'undefined'
      ? ('Цвет: ' + ed['Цвет']) : '');
var coatLabel = (ed && ed['Покрытие'] && ed['Покрытие'] !== 'Без покрытия')
  ? ('Покрытие: ' + ed['Покрытие']) : '';
var widthLabel = (ed && ed.pack_y) ? ('Ширина: ' + ed.pack_y + ' мм') : '';
var lengthVal  = ed && ed.pack_x ? parseFloat(ed.pack_x) : 0;
var lengthLabel = lengthVal ? ('Длина: ' + (lengthVal >= 1000 ? (lengthVal / 1000) + ' м' : lengthVal + ' мм')) : '';
/* Вычисленные погонные метры = кол-во единиц × длина доски (как в счётчике на карточке) */
var metersTotal = _qty * _boardLen;
var metersLabel = metersTotal ? ('Погонные метры: ' + (Math.round(metersTotal * 100) / 100) + ' м') : '';
var nameSuffix = [colorLabel, coatLabel, widthLabel, lengthLabel, metersLabel].filter(Boolean).join(' · ');

var propParts = [];
if (ed) {
  var optDims = (_p && _p.json_options) || [];
  if (typeof optDims === 'string') { try { optDims = JSON.parse(optDims); } catch (e) { optDims = []; } }
  var keys = (optDims && optDims.length)
    ? optDims.map(function (o) { return o && o.title; })
    : ['Цвет', 'Покрытие'];
  keys.forEach(function (k) {
    if (k === 'Цена за кв метр') return;
    if (k && ed[k] !== undefined && ed[k] !== '' && String(ed[k]) !== 'undefined') {
      propParts.push(k + ': ' + ed[k]);
    }
  });
  if (widthLabel) propParts.push(widthLabel);
  if (lengthLabel) propParts.push(lengthLabel);
}
var propOpts = propParts.join(', ');

/* Structured options array — Tilda store booking format.
   Tells the warehouse which edition variant to reserve. */
var bookingOptions = [];
if (ed) {
  var optDefs = (_p && _p.json_options) || [];
  if (typeof optDefs === 'string') { try { optDefs = JSON.parse(optDefs); } catch (e) { optDefs = []; } }
  var optKeys = (optDefs && optDefs.length) ? optDefs.map(function (o) { return o && o.title; }) : ['Цвет', 'Покрытие'];
  optKeys.forEach(function (k) {
    if (k && ed[k] !== undefined && ed[k] !== '' && String(ed[k]) !== 'undefined') {
      bookingOptions.push({ option: k, variant: String(ed[k]) });
    }
  });
}

var item = {
  name:     _p.title + (nameSuffix ? ' · ' + nameSuffix : ''),
  option:   propOpts,
  options:  bookingOptions,
  price:    price,
  quantity: _qty,
  amount:   price * _qty,
  img:      img,
  uid:      String(ed && ed.uid ? ed.uid : _p.uid),
  sku:      (ed && ed.sku) || (_p.sku) || ''
};
  console.log('nx: item to cart', JSON.stringify(item));
  var added = false;
  function doAdd(retries) {
    try {
      if (typeof tcart__addProduct === 'function') {
        tcart__addProduct(item, true); /* true = open cart popup after adding */
      } else if (window.tcart && window.tcart.products) {
        window.tcart.products.push(item);
        if (typeof tcart__saveLocalObj === 'function') tcart__saveLocalObj();
      } else {
        throw new Error('tcart not ready');
      }
      /* Success path: re-add fallback + toast */
      try {
        if (window.tcart && window.tcart.products) {
          var inCart = window.tcart.products.some(function (p) {
            return String(p.uid) === item.uid && p.option === item.option;
          });
          if (!inCart) {
            window.tcart.products.push(item);
            if (typeof tcart__saveLocalObj === 'function') tcart__saveLocalObj();
            if (typeof tcart__reDrawCartIcon === 'function') tcart__reDrawCartIcon();
            if (typeof tcart__reDrawProducts === 'function') tcart__reDrawProducts();
            console.log('nx: re-added dropped item', item.uid);
          }
        }
      } catch (e2) { console.error('nx: re-add error', e2); }
      showToast('Добавлено в корзину: ' + _p.title);
    } catch (e) {
      if (retries > 0) { setTimeout(function () { doAdd(retries - 1); }, 300); return; }
      console.error('nx: addToCart error', e);
    }
  }
  doAdd(5);
}

  function renderRoot(p) {
    _p        = p;
    _editions = p.editions || [];
    _isBoard  = _editions.some(function (e) { return parseFloat(e.pack_x) > 0; });
    _boardLen = _isBoard ? (parseFloat(_editions[0].pack_x) / 1000 || 6) : 0;

    /* Непалубные товары (крепёж и т.п.) — реальные варианты берём из
       p.json_options (то же поле, что уже читает addToCart для корзины),
       а не из board-специфичных Ширина(мм)/Длина/pack_x. */
    _genericAttrKeys = [];
    if (!_isBoard) {
      var jsonOpts = p.json_options;
      if (typeof jsonOpts === 'string') { try { jsonOpts = JSON.parse(jsonOpts); } catch (e) { jsonOpts = []; } }
      var GENERIC_EXCLUDE = { 'Цвет': true, 'Покрытие': true, 'Тип покрытия': true };
      (jsonOpts || []).forEach(function (o) {
        if (o && o.title && !GENERIC_EXCLUDE[o.title] && _genericAttrKeys.indexOf(o.title) === -1) {
          _genericAttrKeys.push(o.title);
        }
      });
    }

    COATING_MAP = {};
    _noColorCoatings = {};
    _editions.forEach(function (e) {
      if (e['Покрытие']) COATING_MAP[e['Покрытие']] = e['Покрытие'];
      if (e['Цвет'] === 'без') _noColorCoatings[e['Покрытие']] = true;
    });

    var colorMap = getColorMap();
    if (p.properties) {

      if (e.target.closest('.nx-pop-prev')) {
        var card = popGrid.querySelector('.nx-pop2');
        popGrid.scrollBy({ left: -(card ? card.offsetWidth + 20 : 305), behavior: 'smooth' });
      } else if (e.target.closest('.nx-pop-next')) {
        var card = popGrid.querySelector('.nx-pop2');
        popGrid.scrollBy({ left: card ? card.offsetWidth + 20 : 305, behavior: 'smooth' });
      }
    });

    /* Популярные товары — кнопка «Купить» */
    root.addEventListener('click', function (e) {
      var btn = e.target.closest('.nx-pop2__buy');
      if (!btn) return;
      e.preventDefault();
      var uid = btn.dataset.uid;
      var prod = _allProducts.find(function (x) { return String(x.uid) === String(uid); });
      if (!prod) return;
      var ed0 = (prod.editions || [])[0] || {};
      var img = popularCardImg(prod);
      var item = {
        name:     prod.title,
        price:    parsePrice(ed0.price || prod.price),
        quantity: 1,
        amount:   parsePrice(ed0.price || prod.price),
        img:      img,
        uid:      String(ed0.uid || prod.uid),
        option:   [(ed0['Цвет'] && ed0['Цвет'] !== 'без' ? 'Цвет: ' + ed0['Цвет'] : ''), (ed0['Покрытие'] ? 'Покрытие: ' + ed0['Покрытие'] : '')].filter(Boolean).join(', ')
      };
      try {
        if (typeof tcart__addProduct === 'function') {
          tcart__addProduct(item, true);
          showToast('Добавлено в корзину: ' + prod.title);
        }
      } catch (ex) { console.error('nx: pop buy error', ex); }
    });

    setTimeout(restoreColorFromPalette, 150);
  }

  /* Нативный Tilda-блок «Популярные товары» (rec2362047083) на странице товара
     дублирует один и тот же товар — заменён собственной сеткой renderPopularGrid()
     с реальными разными товарами. Прячем нативный блок, чтобы не было дублей. */
  function hideNativePopularBlock() {
    function hide(rec) { rec.style.cssText = 'display:none!important'; }
    var existing = document.getElementById('rec2362047083');
    if (existing) { hide(existing); return; }
    var n = 0;
    var iv = setInterval(function () {
      var rec = document.getElementById('rec2362047083');
      if (rec) { clearInterval(iv); hide(rec); return; }
      if (++n > 50) clearInterval(iv);
    }, 100);
  }

  function boot() {
    var m = location.pathname.match(/\/tproduct\/(\d+)/);
    if (!m) return;
    var uid = m[1];
    function revealOnFail() {
      document.documentElement.classList.remove('nx-tp');
    }
    loadProduct(uid).then(function (p) {
      if (!p) { console.error('nx: product not found'); revealOnFail(); return; }
      renderRoot(p);
    }).catch(function (err) { console.error('nx: loadProduct error', err); revealOnFail(); });
  }

  /* Создать #nx-prod-root как можно раньше — чтобы не было пустоты пока грузится продукт.
     Возвращает существующий или только что созданный корень (используется и в renderRoot).

     Tilda использует две разные структуры для /tproduct/ страниц:
       A) Обычная:  <div id="allrecords"><div id="recXXX">(header)...
       B) Новая:    <body><div class="t-zoomer__wrapper">...  (нет #allrecords!)
     В случае B вставляем root первым ребёнком body. CSS (body > #nx-prod-root)
     делает его position:fixed z-index:99999 — перекрывает zoomer независимо от
     того, что с ним делает tilda-zoom-2.0.min.js. */
  function ensureProdRoot() {
    var root = document.getElementById('nx-prod-root');
    if (root) return root;
    root = document.createElement('div');
    root.id = 'nx-prod-root';
    var allrec = document.getElementById('allrecords');
    if (allrec && allrec.children.length) {
      /* Структура A: вставляем вторым ребёнком (первый — шапка) */
      allrec.insertBefore(root, allrec.children[1] || null);
    } else {
      /* Структура B (t-zoomer): вставляем первым ребёнком body.
         CSS body > #nx-prod-root покрывает весь вьюпорт поверх zoomer. */
      document.body.insertBefore(root, document.body.firstChild || null);
      /* Полифилл: на Structure B нет #allrecords вообще, а нативные Tilda-скрипты
         (напр. tilda-widget-positions — подтверждено консольной ошибкой
         "Cannot read properties of null (reading 'getAttribute')" на
         document.getElementById("allrecords")) читают его безусловно и падают.
         Пустой скрытый div с этим id не меняет их поведение (0 детей — как и
         раньше), но не даёт им получить null и упасть — вероятная причина,
         по которой на этой структуре не открывается попап корзины (скрипт,
         инициализирующий попап, вероятно падает на том же самом allrecords
         раньше, чем успевает отрисовать сам попап). */
      if (!allrec) {
        var stub = document.createElement('div');
        stub.id = 'allrecords';
        stub.style.cssText = 'display:none!important';
        root.appendChild(stub);
      }
    }
    return root;
  }

  /* Запускаем сразу на DOMContentLoaded — не ждём window.load */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      ensureProdRoot();
      setTimeout(boot, 50);
    });
  } else {
    ensureProdRoot();
    setTimeout(boot, 50);
  }
  /* Fallback: window.load на случай если DOMContentLoaded уже прошёл */
  window.addEventListener('load', function () {
    if (!document.querySelector('#nx-prod-root .nx-p-inner')) setTimeout(boot, 100);
  });

  window.addEventListener('pageshow', function (e) {
    if (e.persisted) setTimeout(restoreColorFromPalette, 200);
  });
})();

/* ══ 5. Перехват ошибки оформления → «Заявка отправлена» ══ */
(function () {
  'use strict';
  var _handled = false;
  var ERR_TEXT = 'Не удается оформить заказ';

  function handleCheckoutError(errEl) {
    if (_handled) return;
    _handled = true;
    try { if (_obs) _obs.disconnect(); } catch (e) {}

    errEl.style.cssText = 'display:none!important';

    if (document.getElementById('nx-cart-ok')) return;
    var wrap = errEl.closest('[class*="t-cart"]') || errEl.parentElement;
    var ok = document.createElement('div');
    ok.id = 'nx-cart-ok';
    ok.style.cssText = 'padding:28px 20px;text-align:center;font-family:GothamPro,sans-serif;';
    ok.innerHTML =
      '<div style="color:#4C9E24;font-size:44px;line-height:1;margin-bottom:12px;">✓</div>' +
      '<div style="font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:8px;">Заявка отправлена!</div>' +
      '<div style="font-size:13px;color:#888;line-height:1.6;">Менеджер свяжется с вами<br>в ближайшее время</div>';
    wrap.insertBefore(ok, wrap.firstChild);

    setTimeout(function () {
      /* Очистить корзину в localStorage и перезагрузить страницу —
         это закроет попап и вернёт клиента на карточку товара */
      try { localStorage.removeItem('tcart'); } catch (e) {}
      try {
        if (window.tcart) window.tcart.products = [];
        if (typeof tcart__saveLocalObj === 'function') tcart__saveLocalObj();
      } catch (e) {}
      window.location.href = window.location.href;
    }, 3500);
  }

  function checkNode(el) {
    if (!el || el.nodeType !== 1) return;
    /* Сам элемент */
    if ((el.textContent || '').indexOf(ERR_TEXT) !== -1) {
      /* Ищем листовой/ближайший видимый узел с ошибкой */
      var target = el;
      if (el.querySelectorAll) {
        var children = el.querySelectorAll('*');
        for (var k = 0; k < children.length; k++) {
          if ((children[k].textContent || '').indexOf(ERR_TEXT) !== -1) {
            target = children[k]; break;
          }
        }
      }
      handleCheckoutError(target);
    }
  }

  /* Слушаем и добавление новых узлов, и изменение атрибутов/стилей существующих */
  var _obs = new MutationObserver(function (mutations) {
    if (_handled) return;
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === 'childList') {
        for (var j = 0; j < m.addedNodes.length; j++) checkNode(m.addedNodes[j]);
      } else if (m.type === 'attributes') {
        var t = m.target;
        if (t && t.nodeType === 1 && (t.textContent || '').indexOf(ERR_TEXT) !== -1) {
          var st = window.getComputedStyle(t);
          if (st.display !== 'none' && st.visibility !== 'hidden') handleCheckoutError(t);
        }
      }
    }
  });

  /* Ошибка оформления появляется ТОЛЬКО после отправки формы заказа в корзине.
     Поэтому вешаем наблюдатель ЛЕНИВО — на первый клик по корзине — и на
     контейнер корзины (.t706), а не на весь body с attributes-слежением
     (самый дорогой наблюдатель раньше висел на каждой странице). */
  var _attached = false;
  function attachObs() {
    if (_attached) return;
    _attached = true;
    var host = document.querySelector('.t706') || document.body;
    _obs.observe(host, {
      childList: true, subtree: true,
      attributes: true, attributeFilter: ['style', 'class']
    });
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest('a[href="#opencart"], .t706__carticon, .t-menuwidgeticons__link_cart, .t706')) attachObs();
  }, true);
})();

</script>


<script>
/* ═══════════════════════════════════════════════════
   COMMON — Блок «Популярные товары»
   Все страницы сайта
══════════════════════════════════════════════════ */
(function () {
  'use strict';

  var REC_ID = '2362047083';

  function scrollGrid(dir) {
    var grid = document.querySelector('#rec' + REC_ID + ' .js-store-grid-cont');
    if (!grid) return;
    var card = grid.querySelector('.t-store__card');
    var step = card ? (card.offsetWidth + 20) : 285;
    grid.scrollBy({ left: dir * step, behavior: 'smooth' });
  }

  function injectHeader() {
    var rec = document.getElementById('rec' + REC_ID);
    if (!rec || rec.querySelector('.nx-popular-toprow')) return;
    var titleEl = rec.querySelector('.t-section__title');
    if (!titleEl) return;

    var topRow = document.createElement('div');
    topRow.className = 'nx-popular-toprow';
    titleEl.parentNode.insertBefore(topRow, titleEl);
    topRow.appendChild(titleEl);

    var right = document.createElement('div');
    right.className = 'nx-popular-right';
    right.innerHTML =
      '<a href="/catalog" class="nx-catalog-link">Перейти в каталог</a>' +
      '<div class="nx-popular-arrows">' +
        '<button class="nx-arrow-btn nx-arrow-prev">‹</button>' +
        '<button class="nx-arrow-btn nx-arrow-next">›</button>' +
      '</div>';
    topRow.appendChild(right);

    right.querySelector('.nx-arrow-prev').onclick = function () { scrollGrid(-1); };
    right.querySelector('.nx-arrow-next').onclick = function () { scrollGrid(1); };
  }

  function init() {
    if (!document.getElementById('rec' + REC_ID)) return;
    injectHeader();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 500);
  }
})();
</script>

<script>
/* ══ Кликабельный баннер Telegram (блок T368) ══
   Картинка banner_tg.png не имеет ссылки в стандартном блоке — оборачиваем её
   в ссылку на канал. Привязка по имени файла, чтобы не задеть другие T368. */
(function () {
  var TG_URL = 'https://t.me/artdoska';
  function linkTgBanner() {
    var imgs = document.querySelectorAll('img.t368__img');
    for (var i = 0; i < imgs.length; i++) {
      var img = imgs[i];
      if ((img.getAttribute('src') || '').indexOf('banner_tg') === -1) continue;
      if (img.closest('a.nx-tg-link')) continue;
      var a = document.createElement('a');
      a.className = 'nx-tg-link';
      a.href = TG_URL; a.target = '_blank'; a.rel = 'noopener';
      a.style.cssText = 'display:block;cursor:pointer;';
      img.parentNode.insertBefore(a, img);
      a.appendChild(img);
    }
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', linkTgBanner);
  else linkTgBanner();
  setTimeout(linkTgBanner, 600);
  setTimeout(linkTgBanner, 1500);
})();
</script>
