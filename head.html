<script>
/* ══ Скрытие ошибки заказа склада ══
   Прячем сообщение корзины только если это ошибка склада/заказа
   (Order error / NOT FOUND PRODUCTS IN STORE), не трогая валидацию полей. */
(function () {
  var _storeErrScheduled = false;
  var _storeErrObs = null;
  function hideStoreOrderError() {
    var boxes = document.querySelectorAll('.t-form__errorbox-text, .t-store__error, .js-errorbox-all, .t-form__errorbox');
    for (var i = 0; i < boxes.length; i++) {
      var t = (boxes[i].textContent || '').toLowerCase();
      if (t.indexOf('order error') !== -1 || t.indexOf('not found') !== -1 ||
          t.indexOf('booking') !== -1 || t.indexOf('склад') !== -1) {
        boxes[i].style.setProperty('display', 'none', 'important');
      }
    }
  }
  function scheduleHideStoreOrderError() {
    if (_storeErrScheduled) return;
    _storeErrScheduled = true;
    setTimeout(function () {
      _storeErrScheduled = false;
      hideStoreOrderError();
    }, 120);
  }
  if (window.MutationObserver) {
    _storeErrObs = new MutationObserver(scheduleHideStoreOrderError);
    function startStoreErrObs() {
      var host = document.body || document.documentElement;
      _storeErrObs.observe(host, { childList: true, subtree: true });
    }
    if (document.body) startStoreErrObs();
    else document.addEventListener('DOMContentLoaded', startStoreErrObs);
  }
  document.addEventListener('DOMContentLoaded', hideStoreOrderError);
})();
</script>

<script>
/* Remove legacy fallback catalog sidebar if it appears */
(function () {
  'use strict';

  function removeFallbackSidebar() {
    document.querySelectorAll('.nx-fallback-sidebar-parts').forEach(function (node) {
      var holder = node.closest('.js-sidebar-parts');
      node.remove();
      if (holder && !holder.children.length) holder.remove();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', removeFallbackSidebar);
  } else {
    removeFallbackSidebar();
  }

  var obs = new MutationObserver(function () { removeFallbackSidebar(); });
  function start() {
    if (!document.body) return;
    obs.observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>

<script>
/* ══ 1. Скрытие «Палитры» + ссылка ══ */
(function () {
  'use strict';
  if (location.pathname.indexOf('/catalog') !== 0 && location.pathname !== '/') return;
  function hidePalette() {
    document.querySelectorAll('.t-catalog__parts-text-title').forEach(function (el) {
      if (el.textContent.trim().toLowerCase().indexOf('палитра') !== -1) {
        var item = el.closest('.t-catalog__parts-tree-item');
        if (item) item.style.setProperty('display', 'none', 'important');
      }
    });
  }
  function injectPaletteLink() {
    if (document.querySelector('.nx-palette-link-wrap')) return;
    var tree = document.querySelector('.t-catalog__parts-tree');
    if (!tree) return;
    var wrap = document.createElement('div');
    wrap.className = 'nx-palette-link-wrap';
    wrap.innerHTML = '<a href="/palitra" class="nx-palette-link">🎨 Все цвета палитры</a>';
    tree.appendChild(wrap);
  }
  function init() {
    var _paletteScheduled = false;
    function schedulePaletteRefresh() {
      if (_paletteScheduled) return;
      _paletteScheduled = true;
      setTimeout(function () {
        _paletteScheduled = false;
        hidePalette();
        injectPaletteLink();
      }, 120);
    }
    hidePalette();
    injectPaletteLink();
    new MutationObserver(schedulePaletteRefresh)
      .observe(document.body, { childList: true, subtree: true });
  }
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', init) : setTimeout(init, 300);
})();

/* ══ 2. Карточки — унифицированное обогащение (все страницы) ══ */
(function () {
  function qs(card) {
    var args = Array.prototype.slice.call(arguments, 1);
    for (var i = 0; i < args.length; i++) { var el = card.querySelector(args[i]); if (el) return el; }
    return null;
  }
  function parsePrice(n) { return parseFloat(String(n || 0).replace(/\s/g, '').replace(',', '.')) || 0; }

  function injectCategoryBadge(card) {
    if (card.querySelector('.nx-cat-badge')) return;
    var title = qs(card, '.t-catalog__card__title', '.t-store__card__title', '[class*="card__title"]');
    if (!title) return;
    var text = title.textContent;
    var cat = /вагонк/i.test(text)   ? 'Вагонка'
            : /блок.хаус/i.test(text) ? 'Блок-хаус'
            : /имитац/i.test(text)    ? 'Имитация бруса'
            : /планк/i.test(text)     ? 'Планкен'
            : /термо/i.test(text)     ? 'Термодерево' : '';
    if (!cat) return;
    var badge = document.createElement('div');
    badge.className = 'nx-cat-badge';
    badge.textContent = cat;
    var wrapper = qs(card, '.t-catalog__card__imgwrapper', '.t-store__card__imgwrapper', '[class*="imgwrapper"]');
    if (wrapper) wrapper.appendChild(badge);
  }

  function injectSize(card) {
    if (card.querySelector('.nx-size-row')) return;
    var title = qs(card, '.t-catalog__card__title', '.t-store__card__title', '[class*="card__title"]');
    if (!title) return;
    var m = title.textContent.match(/(\d+)[хx×](\d+)[хx×](\d+)/i);
    if (!m) return;
    var sizeRow = document.createElement('div');
    sizeRow.className = 'nx-size-row';
    sizeRow.innerHTML = '<strong>Размер:</strong> ' + m[1] + '×' + m[2] + '×' + m[3];
    title.parentNode.insertBefore(sizeRow, title.nextSibling);
  }

  function injectDualPrice(card) {
    if (card.querySelector('.nx-price-block')) return;
    var priceEl = qs(card, '.t-catalog__card__price-value', '.t-store__card__price-value', '[class*="price-value"]');
    if (!priceEl) return;
    var priceEach = parsePrice(priceEl.textContent);
    if (!priceEach) return;
    var sqmSelect = card.querySelector('[data-edition-option-id="Цена за кв метр"] select');
    var priceSqm  = sqmSelect ? parsePrice(sqmSelect.value) : parsePrice(card.getAttribute('data-price-sqm'));
    var oldPriceEl = qs(card,
      '.t-catalog__card__price_old .t-catalog__card__price-value',
      '.t-store__card__price_old .t-store__card__price-value'
    );
    var oldPrice = oldPriceEl ? parsePrice(oldPriceEl.textContent) : 0;
    var oldRowHtml = '';
    if (oldPrice > priceEach) {
      var pct = Math.round((1 - priceEach / oldPrice) * 100);
      oldRowHtml = '<div class="nx-price-old-row"><span class="nx-price-extra__old">' + oldPrice.toLocaleString('ru') + ' ₽</span><span class="nx-price-extra__badge">-' + pct + '%</span></div>';
    }
    var nativePrice = qs(card, '.t-catalog__card__price-wrapper', '.t-store__card__price-wrapper', '.t-store__card__price', '.t-catalog__card__price');
    if (nativePrice) nativePrice.style.display = 'none';
    var block = document.createElement('div');
    block.className = 'nx-price-block';
    block.innerHTML = '<div class="nx-price-row"><div class="nx-price-col"><span class="nx-price-label">Цена за шт.:</span><span class="nx-price-val-main">' + priceEach.toLocaleString('ru') + ' ₽</span></div>' +
      (priceSqm ? '<div class="nx-price-col"><span class="nx-price-label">Цена за кв.м.:</span><span class="nx-price-val-main">' + priceSqm.toLocaleString('ru') + ' ₽</span></div>' : '') +
      '</div>' + oldRowHtml;
    var textWrap = qs(card, '.t-catalog__card__textwrapper', '.t-store__card__textwrapper', '[class*="textwrapper"]');
    if (textWrap) textWrap.appendChild(block);
  }

  function initHoverPhoto(card) {
    if (card.dataset.nxHover) return;
    card.dataset.nxHover = '1';
    var imgs = card.querySelectorAll('.t-catalog__card__bgimg, .t-store__card__bgimg, [class*="card__bgimg"]');
    if (imgs.length < 2) return;
    var main = imgs[0], hover = imgs[1];
    hover.style.opacity = '0'; hover.style.transition = 'opacity 0.2s';
    card.addEventListener('mouseenter', function () { main.style.opacity = '0'; hover.style.opacity = '1'; });
    card.addEventListener('mouseleave', function () { main.style.opacity = '1'; hover.style.opacity = '0'; });
  }

  function injectDeliveryInfo(card) {
    if (location.pathname.indexOf('/palitra') === 0) return;
    if (card.querySelector('.nx-delivery-row')) return;
    var wrap = qs(card, '.t-catalog__card__wrap_txt-and-btns', '.t-store__card__wrap_txt-and-btns');
    if (!wrap) return;
    var row = document.createElement('div');
    row.className = 'nx-delivery-row';
    row.innerHTML =
      '<div class="nx-delivery-item">Есть самовывоз сегодня</div>' +
      '<div class="nx-delivery-item">Доставка сегодня или завтра</div>';
    wrap.appendChild(row);
  }

  function processCards() {
    document.querySelectorAll('.t-catalog__card:not([data-nx-enriched]), .t-store__card:not([data-nx-enriched])').forEach(function (card) {
      card.setAttribute('data-nx-enriched', '1');
      injectCategoryBadge(card); injectSize(card); injectDualPrice(card); initHoverPhoto(card); injectDeliveryInfo(card);
    });
  }
  function scheduleProcessCards(delay) {
    setTimeout(function () {
      if (typeof window.requestIdleCallback === 'function') {
        window.requestIdleCallback(function () { processCards(); }, { timeout: 700 });
      } else {
        processCards();
      }
    }, delay || 0);
  }

  window._nxProcessCards = processCards;

  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', function () { scheduleProcessCards(0); }); }
  else { scheduleProcessCards(0); }
  scheduleProcessCards(800);
  scheduleProcessCards(2000);
})();

/* ══ 3. Страница товара /tproduct/ ══ */
(function () {
  if (location.pathname.indexOf('/tproduct/') === -1) return;

  var STORE_UID   = '650833272852';
  var CATALOG_REC = '2362174763';

  var _p            = null;
  var _editions     = [];
  var _selected     = {};
  var _qty          = 1;
  var _boardLen     = 6;
  var _paletteColor = null;

  function parsePrice(n) { return parseFloat(String(n || 0).replace(/\s/g, '').replace(',', '.')) || 0; }
  function fmt(n) { return parsePrice(n).toLocaleString('ru'); }

  function showToast(msg) {
    var t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);' +
      'background:#4C9E24;color:#fff;padding:12px 24px;border-radius:10px;' +
      'font-size:14px;font-weight:600;z-index:10000;box-shadow:0 4px 20px rgba(0,0,0,.25);' +
      'white-space:nowrap;pointer-events:none;font-family:GothamPro,sans-serif;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3000);
  }

  function getColorMap() {
    var map = {};
    try {
      var opts = window.tStoreOptionsList || [];
      var colorOpt = opts.find(function (o) { return o.title === 'Цвет'; });
      if (colorOpt) (colorOpt.values || []).forEach(function (v) { map[String(v.value)] = v.color || ''; });
    } catch (e) {}
    return map;
  }

  function loadProduct(uid) {
    return fetch('https://store.tildaapi.one/api/getproductslist/?storepartuid=' + STORE_UID + '&recid=' + CATALOG_REC)
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        if (!txt || txt.indexOf('ERROR') === 0) {
          console.warn('nx: store API error:', (txt || '').slice(0, 80));
          return null;
        }
        var d;
        try { d = JSON.parse(txt); } catch (e) { console.warn('nx: store API non-JSON response'); return null; }
        return (d.products || []).find(function (x) { return String(x.uid) === String(uid); }) || null;
      });
  }

  var COATING_MAP = {};
  var _noColorCoatings = {};

  function matchBase(e) {
    var edCoating = COATING_MAP[_selected['Тип покрытия'] || ''];
    var noCovering = edCoating ? !!_noColorCoatings[edCoating] : false;
    if (!_paletteColor && !noCovering && _selected['Цвет'] && e['Цвет'] !== undefined && e['Цвет'] !== _selected['Цвет']) return false;
    if (_selected['Ширина (мм)'] && e.pack_y && String(e.pack_y) !== _selected['Ширина (мм)']) return false;
    if (_selected['Длина'] && e.pack_x && String(e.pack_x) !== _selected['Длина']) return false;
    return true;
  }

  function getEd() {
    var selectedCoating = _selected['Тип покрытия'] || '';
    var edCoating = COATING_MAP[selectedCoating];

    if (edCoating) {
      var exact = _editions.find(function (e) {
        return matchBase(e) && e['Покрытие'] === edCoating;
      });
      if (exact) return exact;
    }

    var candidates = _editions.filter(matchBase);
    return candidates.find(function (e) { return e['Покрытие'] === 'Без покрытия'; })
      || candidates[0]
      || _editions[0] || null;
  }

  function getCoatingDelta() {
    var selectedCoating = _selected['Тип покрытия'] || '';
    if (!selectedCoating || COATING_MAP[selectedCoating] !== undefined) return 0;
    var coatingProp = (_p && _p.properties || []).find(function (prop) { return prop.title === 'Тип покрытия'; });
    if (!coatingProp) return 0;
    var line = coatingProp.values.split('\n').find(function (v) { return v.split('=')[0].trim() === selectedCoating; }) || '';
    var m = line.match(/=\+?(\d+)/);
    return m ? parseFloat(m[1]) : 0;
  }

  function renderPrices(ed) {
    var price    = parsePrice(ed ? ed.price : (_p ? _p.price : 0)) + getCoatingDelta();
    var priceOld = parsePrice(ed ? ed.priceold : (_p ? _p.priceold : 0));
    var priceSqm = parsePrice(ed ? ed['Цена за кв метр'] : 0);
    var discHtml = '';
    if (priceOld > price) {
      var pct = Math.round((1 - price / priceOld) * 100);
      discHtml = '<div class="nx-p-price-old-row"><span class="nx-p-price-old">' + fmt(priceOld) + ' ₽</span><span class="nx-p-badge">-' + pct + '%</span></div>';
    }
    return '<div class="nx-p-price-col"><span class="nx-p-price-lbl">Цена за шт.:</span><span class="nx-p-price">' + fmt(price) + ' ₽</span>' + discHtml + '</div>' +
      '<div class="nx-p-prices-spacer"></div>' +
      (priceSqm ? '<div class="nx-p-price-col"><span class="nx-p-price-lbl">Цена за кв.м.:</span><span class="nx-p-price--sqm">' + fmt(priceSqm) + ' ₽</span></div>' : '<div></div>');
  }

  function renderColorSwatches(editions, colorMap) {
    var seen = {};
    var swatches = editions.filter(function (e) {
      var c = String(e['Цвет']); if (!c || seen[c]) return false; seen[c] = true; return true;
    }).map(function (e) {
      var colorVal = String(e['Цвет']);
      var hex = colorMap[colorVal] || '';
      var active = _selected['Цвет'] === colorVal ? ' nx-p-color-btn--active' : '';
      var innerStyle = e.img
        ? ' style="background-image:url(' + e.img + ');background-size:cover;background-position:center;"'
        : (hex ? ' style="background:' + hex + '"' : '');
      return '<button class="nx-p-color-btn' + active + '" data-color="' + colorVal + '" title="' + colorVal + '"><div class="nx-p-color-inner"' + innerStyle + '></div></button>';
    }).join('');
    return '<div class="nx-p-opt-lbl">Цвет:</div>' +
      '<div class="nx-p-color-circles">' + swatches +
      '<a href="/palitra" class="nx-p-palette-btn" id="nx-palette-btn">Палитра цветов</a></div>';
  }

  function renderSelects(properties, editions) {
    var selects = [];

    (properties || []).forEach(function (opt) {
      var vals = opt.values.split('\n').map(function (v) { return v.split('=')[0].trim(); });
      var options = vals.map(function (v) {
        return '<option value="' + v + '"' + (_selected[opt.title] === v ? ' selected' : '') + '>' + v + '</option>';
      }).join('');
      selects.push(
        '<div class="nx-p-select-wrap" data-prop="' + opt.title + '">' +
          '<span class="nx-p-opt-lbl">' + opt.title + ':</span>' +
          '<select class="nx-p-select" data-prop="' + opt.title + '">' + options + '</select>' +
        '</div>'
      );
    });

    var lengths = [];
    var seenLen = {};
    (editions || []).forEach(function (e) {
      var l = String(parseFloat(e.pack_x));
      if (l && l !== 'NaN' && !seenLen[l]) { seenLen[l] = true; lengths.push(l); }
    });
    if (lengths.length) {
      var lenOptions = lengths.map(function (l) {
        var n = parseFloat(l);
        var display = n >= 1000 ? (n / 1000) + ' м' : l + ' мм';
        return '<option value="' + l + '"' + (_selected['Длина'] === l ? ' selected' : '') + '>' + display + '</option>';
      }).join('');
      selects.splice(1, 0,
        '<div class="nx-p-select-wrap">' +
          '<span class="nx-p-opt-lbl">Длина:</span>' +
          '<select class="nx-p-select" data-prop="Длина">' + lenOptions + '</select>' +
        '</div>'
      );
    }

    return '<div class="nx-p-selects">' + selects.join('') + '</div>';
  }

  function renderGallery(gallery) {
    var imgs = gallery.map(function (g) { return g.img || g; });
    var firstImg = imgs[0] || '';
    var thumbs = imgs.map(function (src, i) {
      return '<div class="nx-p-thumb' + (i === 0 ? ' nx-p-thumb--active' : '') +
        '" data-idx="' + i + '"><img src="' + src + '" alt="" loading="lazy" fetchpriority="low"></div>';
    }).join('');
    return '<div class="nx-p-gallery">' +
      '<div class="nx-p-mainimg"><img id="nx-mi" src="' + firstImg + '" alt="" loading="eager" fetchpriority="high"></div>' +
      '<div class="nx-p-thumbs">' + thumbs + '</div>' +
      '</div>';
  }

  function normalizeImageSrc(src) {
    if (src == null) return '';
    var s = String(src).trim();
    if (!s || s === 'undefined' || s === 'null') return '';
    if (/[\r\n]/.test(s)) return '';
    if (s.indexOf('javascript:') === 0) return '';
    if (
      s.indexOf('http://') === 0 ||
      s.indexOf('https://') === 0 ||
      s.indexOf('//') === 0 ||
      s.indexOf('/') === 0 ||
      s.indexOf('./') === 0 ||
      s.indexOf('../') === 0 ||
      s.indexOf('data:image/') === 0 ||
      s.indexOf('blob:') === 0
    ) return s;
    return '';
  }

  function ensureMainImagePreload(src) {
    var safeSrc = normalizeImageSrc(src);
    if (!safeSrc) return;
    var head = document.head || document.getElementsByTagName('head')[0];
    if (!head) return;
    var ln = document.getElementById('nx-preload-mainimg');
    if (!ln) {
      ln = document.createElement('link');
      ln.id = 'nx-preload-mainimg';
      ln.rel = 'preload';
      ln.as = 'image';
      ln.fetchPriority = 'high';
      head.appendChild(ln);
    }
    if (ln.href !== safeSrc) ln.href = safeSrc;
  }

  function renderChars(chars) {
    if (!chars || !chars.length) return '';
    return '<div class="nx-p-chars"><div class="nx-p-chars-ttl">Характеристики</div><div class="nx-p-chars-list">' +
      chars.map(function (c) { return '<div class="nx-p-chars-item"><strong>' + c.title + ':</strong> ' + c.value + '</div>'; }).join('') +
      '</div></div>';
  }

function addToCart() {
  if (!_p) return;
  var ed = getEd();

  /* Страховка: палитровый цвет не должен уйти в корзину с несовместимым
     покрытием (например, Valtti-цвет при «Укрывной»). Если рассинхрон —
     сбрасываем палитровый цвет, в корзину идёт реальное издание. */
  if (_paletteColor && ed && !nxPaletteFitsCoating(_paletteColor, ed['Покрытие'])) {
    clearPaletteColor();
  }

  // Установить цвет ДО формирования optParts
  if (ed && ed['Покрытие'] === 'Без покрытия') {
    _selected['Цвет'] = 'без';
  }

  var price = parsePrice(ed ? ed.price : _p.price) + getCoatingDelta();
  var img = (_paletteColor && _paletteColor.img) ? _paletteColor.img
            : (ed && ed.img) ? ed.img : '';

var paletteLabel = _paletteColor
  ? (_paletteColor.code + (_paletteColor.name && _paletteColor.name !== _paletteColor.code ? ' ' + _paletteColor.name : ''))
  : '';

// opts — отображение в корзине и CRM
var optParts = [];
if (_paletteColor) {
  optParts.push('Цвет: ' + paletteLabel);
} else if (ed && ed['Цвет'] && ed['Цвет'] !== 'undefined' && ed['Цвет'] !== 'без') {
  optParts.push('Цвет: ' + ed['Цвет']);
}
if (_selected['Ширина (мм)']) {
  optParts.push('Ширина: ' + _selected['Ширина (мм)'] + ' мм');
}
if (ed && ed['Покрытие']) {
  optParts.push('Покрытие: ' + ed['Покрытие']);
}
if (ed && ed['Цена за кв метр'] && parseFloat(String(ed['Цена за кв метр']).replace(/\s/g,'')) > 0) {
  optParts.push('Цена за кв метр: ' + ed['Цена за кв метр']);
}
var opts = optParts.join(', ');

/* propOpts — ТОЧНЫЕ опции издания Tilda. Ключи и значения ДОЛЖНЫ совпадать с
   вариацией в магазине (опции там: «Цвет» и «Покрытие»), иначе склад не найдёт
   издание → «нет в наличии». Берём значения из подобранного издания ed.
   Палитровый цвет тут НЕ используем: для палитры бронируем базовое издание
   (его реальный цвет), а палитровый цвет показываем только в названии (opts). */
/* ВАЖНО: option должна содержать ВСЕ измерения вариации (Цвет, Покрытие,
   Цена за кв метр) ТОЧНО как в издании — иначе Tilda: «не указана опция».
   Менять/убирать поля нельзя. Чистоту отображения решаем отдельно (в корзине). */
var propParts = [];
if (ed) {
  var optDims = (_p && _p.json_options) || [];
  if (typeof optDims === 'string') { try { optDims = JSON.parse(optDims); } catch (e) { optDims = []; } }
  var keys = (optDims && optDims.length)
    ? optDims.map(function (o) { return o && o.title; })
    : ['Цвет', 'Покрытие'];
  keys.forEach(function (k) {
    /* «Цена за кв метр» — это поле издания для отображения, НЕ опция вариации.
       Если отправить его в option, Tilda трактует как 4-е измерение и склад
       отвечает «не указана опция». Никогда не шлём его в складскую option. */
    if (k === 'Цена за кв метр') return;
    if (k && ed[k] !== undefined && ed[k] !== '' && String(ed[k]) !== 'undefined') {
      propParts.push(k + ': ' + ed[k]);
    }
  });
}
var propOpts = propParts.join(', ');

var item = {
  /* Палитровый цвет — отдельной заметной подписью в названии (не в скобках),
     т.к. в складскую option он не идёт (там измерения реальной вариации).
     Для палитры: «Товар · Цвет из палитры: 2661 Vinha 2661».
     Для обычной вариации цвет/покрытие видны в option ниже. */
  name:     _p.title + (_paletteColor ? ' · Цвет из палитры: ' + paletteLabel : ''),
  option:   propOpts,
  price:    price,
  quantity: _qty,
  amount:   price * _qty,
  img:      img,
  /* uid ВАРИАЦИИ (ed.uid) — Tilda резервирует остаток именно издания (проверено:
     остаток изданий реально списывается). uid товара даёт «нет в наличии» (у товара
     остаток пустой). «Не указана опция» при ed.uid — от старой позиции в корзине. */
  uid:      String(ed && ed.uid ? ed.uid : _p.uid),
  sku:      (ed && ed.sku) || (_p.sku) || ''
};
  console.log('nx: item to cart', JSON.stringify(item));
  var added = false;
  try {
    if (typeof tcart__addProduct === 'function') {
      tcart__addProduct(item); added = true;
    } else if (window.tcart && window.tcart.products) {
      window.tcart.products.push(item);
      if (typeof tcart__saveLocalObj === 'function') tcart__saveLocalObj();
      added = true;
    }
  } catch (e) { console.error('nx: addToCart error', e); }

  /* Страховка: Tilda иногда «тихо» отбрасывает позицию при синхронизации со складом
     (издание не сматчилось / нет в наличии), и второй товар не попадает в корзину.
     Если после addProduct позиции с этим uid в корзине нет — добавляем вручную. */
  try {
    if (added && window.tcart && window.tcart.products) {
      var inCart = window.tcart.products.some(function (p) {
        return String(p.uid) === item.uid && p.option === item.option;
      });
      if (!inCart) {
        window.tcart.products.push(item);
        if (typeof tcart__saveLocalObj === 'function') tcart__saveLocalObj();
        if (typeof tcart__reDrawCartIcon === 'function') tcart__reDrawCartIcon();
        if (typeof tcart__reDrawProducts === 'function') tcart__reDrawProducts();
        console.log('nx: re-added dropped item', item.uid);
      }
    }
  } catch (e) { console.error('nx: re-add error', e); }

  if (added) showToast('Добавлено в корзину: ' + _p.title);
}

var firstEd = firstNonPainting || (_editions.length ? _editions[0] : null);
_selected['Цвет'] = (firstEd && firstEd['Цвет'] !== undefined) ? String(firstEd['Цвет']) : '';

    /* Скрыть нативный Tilda-блок (и его rec), не трогая rec2362047083 (популярные) и наш root */
    var SNIPPET_SELS2 = [
      '.t-store__prod-snippet__container', '.t-store__prod-snippet',
      '.t-catalog__prod-snippet__container', '.t-catalog__prod-snippet'
    ];
    function hideSnippets() {
      SNIPPET_SELS2.forEach(function (sel) {
        document.querySelectorAll(sel).forEach(function (el) {

    function scheduleHideSnippets() {

        hideSnippets();

    /* Первичное скрытие + наблюдатель (Tilda дорисовывает сниппеты асинхронно) */
    hideSnippets();
    var snippetsObs = new MutationObserver(scheduleHideSnippets);
    snippetsObs.observe(document.body, { childList: true, subtree: true });
    /* Держим наблюдение только в фазе первичной дорисовки Tilda */
    setTimeout(function () {

  function updateColors() {
    var colorsEl = document.getElementById('nx-colors');
    if (!colorsEl) return;

    var edCoating = COATING_MAP[selectedCoating];

    }
    if (!filtered.length) filtered = _editions;

    var available = filtered.map(function (e) { return String(e['Цвет']); });
    if (!_paletteColor && _selected['Цвет'] && available.indexOf(_selected['Цвет']) === -1) {
      _selected['Цвет'] = available[0] || '';

    colorsEl.innerHTML = renderColorSwatches(filtered, getColorMap());

  /* Сброс выбранного из палитры цвета: общий блок для всех мест,
     где пользователь уходит от палитрового цвета (клик по свотчу,
     смена покрытия на «Без покрытия», крестик тега цвета). */
  function clearPaletteColor() {
    _paletteColor = null;
    try { sessionStorage.removeItem('nx_palette_color'); } catch (e) {}
    var sw = document.getElementById('nx-color-swatch'); if (sw) sw.style.display = 'none';
    var mi = document.getElementById('nx-mi'); if (mi) mi.style.display = '';
    var ct = document.getElementById('nx-color-tag'); if (ct) ct.remove();
  }

  /* ── Совместимость палитрового цвета и типа покрытия ──
     Бренд цвета (Valtti/RAL/…) должен подходить под выбранное покрытие:
     «Укрывная» → RAL/Vinha/Puutalot/Deco; пропитки/лессир./лак/воск → Valtti. */
  function nxBrandOf(text) {
    text = String(text || '');
    if (/\bvinha\b/i.test(text))    return 'vinha';
    if (/\bvaltti\b/i.test(text))   return 'valtti';
    if (/\bpuutalot\b/i.test(text)) return 'puutalot';
    if (/\bral\b/i.test(text))      return 'ral';
    if (/\bdeco\b/i.test(text))     return 'deco';
    return null;
  }
  var NX_OPAQUE = ['ral', 'vinha', 'puutalot', 'deco'];
  var NX_VALTTI = ['valtti'];
  function nxCoatingBrands(coating) {
    var c = String(coating || '').toLowerCase();
    if (c.indexOf('укрыв') !== -1) return NX_OPAQUE;
    if (c.indexOf('пропит') !== -1 || c.indexOf('лессир') !== -1 ||
        c.indexOf('лак')    !== -1 || c.indexOf('воск')   !== -1 ||
        c.indexOf('valtti') !== -1) return NX_VALTTI;
    return null; /* покрытие без ограничения по бренду */
  }
  function nxPaletteFitsCoating(palette, coating) {
    if (!palette) return true;
    var brand = nxBrandOf(palette.name || palette.code);
    if (!brand) return true;                 /* бренд не распознан — не мешаем */
    var allowed = nxCoatingBrands(coating);
    if (!allowed) return true;               /* нет ограничения */
    return allowed.indexOf(brand) !== -1;
  }

      qtyMeters.addEventListener('click', function (e) {
        var btn = e.target.closest('button'); if (!btn) return;
        var m = Math.max(_boardLen, parseFloat(inpMeters.value) + parseInt(btn.dataset.d) * _boardLen);
        inpMeters.value = m.toFixed(0); _qty = Math.round(m / _boardLen); inpUnits.value = _qty;
      });
      inpMeters.addEventListener('input', function () {
        var m = parseFloat(this.value) || _boardLen;
        _qty = Math.round(m / _boardLen); inpUnits.value = _qty;
      });
    }

    setTimeout(restoreColorFromPalette, 150);
  }

  function injectPopularBlock() {
    var nxRoot = document.getElementById('nx-prod-root');
    if (!nxRoot || !nxRoot.parentNode) return;

    function activate(rec) {
      var snippet = rec.querySelector('.t-store__prod-snippet__container');
      if (snippet) snippet.style.cssText = 'display:none!important';
      rec.style.cssText = '';
      nxRoot.parentNode.insertBefore(rec, nxRoot.nextSibling);
      setTimeout(function () {
        if (typeof window._nxProcessCards === 'function') window._nxProcessCards();
      }, 400);
    }

    var existing = document.getElementById('rec2362047083');
    if (existing) { activate(existing); return; }

    var n = 0;
    var iv = setInterval(function () {
      var rec = document.getElementById('rec2362047083');
      if (rec) { clearInterval(iv); activate(rec); return; }
      if (++n > 50) clearInterval(iv);
    }, 100);
  }

  function boot() {
    var m = location.pathname.match(/\/tproduct\/(\d+)/);
    if (!m) return;
    var uid = m[1];
    function revealOnFail() {
      document.documentElement.classList.remove('nx-tp');
    }
    loadProduct(uid).then(function (p) {
      if (!p) { console.error('nx: product not found'); revealOnFail(); return; }
      renderRoot(p);
    }).catch(function (err) { console.error('nx: loadProduct error', err); revealOnFail(); });
  }

  /* Создать #nx-prod-root как можно раньше — чтобы не было пустоты пока грузится продукт.
     Возвращает существующий или только что созданный корень (используется и в renderRoot). */
  function ensureProdRoot() {
    var root = document.getElementById('nx-prod-root');
    if (root) return root;
    root = document.createElement('div');
    root.id = 'nx-prod-root';
    var allrec = document.getElementById('allrecords');
    if (allrec && allrec.children.length) {
      allrec.insertBefore(root, allrec.children[1] || null);
    } else {
      document.body.appendChild(root);
    }
    return root;
  }

  /* Запускаем сразу на DOMContentLoaded — не ждём window.load */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      ensureProdRoot();
      setTimeout(boot, 50);
    });
  } else {
    ensureProdRoot();
    setTimeout(boot, 50);
  }
  /* Fallback: window.load на случай если DOMContentLoaded уже прошёл */
  window.addEventListener('load', function () {
    if (!document.querySelector('#nx-prod-root .nx-p-inner')) setTimeout(boot, 100);
  });

  window.addEventListener('pageshow', function (e) {
    if (e.persisted) setTimeout(restoreColorFromPalette, 200);
  });
})();

/* ══ 4. Мобильное меню + deeplinks ══ */
(function () {
  function initMobileMenu() {
    var btn = document.querySelector('.t-menu__link-item[href="#catalog"]');
    if (!btn) return;
    btn.addEventListener('click', function (e) {
      var t = document.querySelector('#catalog, [data-catalog]');
      if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth' }); }
    });
  }
  function initDeeplinks() {
    var hash = location.hash;
    if (!hash || hash.length < 2) return;
    document.querySelectorAll('.nx-filter-chip[data-filter]').forEach(function (chip) {
      if (chip.dataset.filter === hash.slice(1)) chip.click();
    });
  }
  window.addEventListener('load', function () { setTimeout(function () { initMobileMenu(); initDeeplinks(); }, 500); });
})();

/* ══ 5. Перехват ошибки оформления → «Заявка отправлена» ══ */
(function () {
  'use strict';
  var _handled = false;
  var ERR_TEXT = 'Не удается оформить заказ';

  function handleCheckoutError(errEl) {
    if (_handled) return;
    _handled = true;
    try { if (_obs) _obs.disconnect(); } catch (e) {}

    errEl.style.cssText = 'display:none!important';

    if (document.getElementById('nx-cart-ok')) return;
    var wrap = errEl.closest('[class*="t-cart"]') || errEl.parentElement;
    var ok = document.createElement('div');
    ok.id = 'nx-cart-ok';
    ok.style.cssText = 'padding:28px 20px;text-align:center;font-family:GothamPro,sans-serif;';
    ok.innerHTML =
      '<div style="color:#4C9E24;font-size:44px;line-height:1;margin-bottom:12px;">✓</div>' +
      '<div style="font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:8px;">Заявка отправлена!</div>' +
      '<div style="font-size:13px;color:#888;line-height:1.6;">Менеджер свяжется с вами<br>в ближайшее время</div>';
    wrap.insertBefore(ok, wrap.firstChild);

    setTimeout(function () {
      /* Очистить корзину в localStorage и перезагрузить страницу —
         это закроет попап и вернёт клиента на карточку товара */
      try { localStorage.removeItem('tcart'); } catch (e) {}
      try {
        if (window.tcart) window.tcart.products = [];
        if (typeof tcart__saveLocalObj === 'function') tcart__saveLocalObj();
      } catch (e) {}
      window.location.href = window.location.href;
    }, 3500);
  }

  function checkNode(el) {
    if (!el || el.nodeType !== 1) return;
    /* Сам элемент */
    if ((el.textContent || '').indexOf(ERR_TEXT) !== -1) {
      /* Ищем листовой/ближайший видимый узел с ошибкой */
      var target = el;
      if (el.querySelectorAll) {
        var children = el.querySelectorAll('*');
        for (var k = 0; k < children.length; k++) {
          if ((children[k].textContent || '').indexOf(ERR_TEXT) !== -1) {
            target = children[k]; break;
          }
        }
      }
      handleCheckoutError(target);
    }
  }

  /* Слушаем и добавление новых узлов, и изменение атрибутов/стилей существующих */
  var _obs = new MutationObserver(function (mutations) {
    if (_handled) return;
    for (var i = 0; i < mutations.length; i++) {
      var m = mutations[i];
      if (m.type === 'childList') {
        for (var j = 0; j < m.addedNodes.length; j++) checkNode(m.addedNodes[j]);
      } else if (m.type === 'attributes') {
        var t = m.target;
        if (t && t.nodeType === 1 && (t.textContent || '').indexOf(ERR_TEXT) !== -1) {
          var st = window.getComputedStyle(t);
          if (st.display !== 'none' && st.visibility !== 'hidden') handleCheckoutError(t);
        }
      }
    }
  });

  /* document.body может ещё не существовать в момент запуска скрипта из <head> */
  function startObs() {
    if (document.body) {
      _obs.observe(document.body, {
        childList: true, subtree: true,
        attributes: true, attributeFilter: ['style', 'class']
      });
    } else {
      document.addEventListener('DOMContentLoaded', function () {
        _obs.observe(document.body, {
          childList: true, subtree: true,
          attributes: true, attributeFilter: ['style', 'class']
        });
      });
    }
  }
  startObs();
})();

</script>


<script>
/* ═══════════════════════════════════════════════════
   COMMON — Блок «Популярные товары»
   Все страницы сайта
══════════════════════════════════════════════════ */
(function () {
  'use strict';

  var REC_ID = '2362047083';

  function scrollGrid(dir) {
    var grid = document.querySelector('#rec' + REC_ID + ' .js-store-grid-cont');
    if (!grid) return;
    var card = grid.querySelector('.t-store__card');
    var step = card ? (card.offsetWidth + 20) : 285;
    grid.scrollBy({ left: dir * step, behavior: 'smooth' });
  }

  function injectHeader() {
    var rec = document.getElementById('rec' + REC_ID);
    if (!rec || rec.querySelector('.nx-popular-toprow')) return;
    var titleEl = rec.querySelector('.t-section__title');
    if (!titleEl) return;

    var topRow = document.createElement('div');
    topRow.className = 'nx-popular-toprow';
    titleEl.parentNode.insertBefore(topRow, titleEl);
    topRow.appendChild(titleEl);

    var right = document.createElement('div');
    right.className = 'nx-popular-right';
    right.innerHTML =
      '<a href="/catalog" class="nx-catalog-link">Перейти в каталог</a>' +
      '<div class="nx-popular-arrows">' +
        '<button class="nx-arrow-btn nx-arrow-prev">‹</button>' +
        '<button class="nx-arrow-btn nx-arrow-next">›</button>' +
      '</div>';
    topRow.appendChild(right);

    right.querySelector('.nx-arrow-prev').onclick = function () { scrollGrid(-1); };
    right.querySelector('.nx-arrow-next').onclick = function () { scrollGrid(1); };
  }

  function init() {
    if (!document.getElementById('rec' + REC_ID)) return;
    injectHeader();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 500);
  }
})();
</script>
